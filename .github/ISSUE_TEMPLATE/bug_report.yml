name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you asked Buddy to do, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: OnePlus 12, Android 16
    validations:
      required: true
  - type: input
    id: buddy
    attributes:
      label: Buddy version
      description: Settings → Check for updates shows it, or Android's App info for Buddy.
      placeholder: 2.1.5 (GitHub)
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Antigravity
        - Grok
        - Not about an agent
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model chip under the chat's title.
      placeholder: Opus 5.5, Big Pickle, …
  - type: dropdown
    id: mode
    attributes:
      label: Approval mode of the app involved
      description: Settings → App permissions.
      options:
        - Trust
        - Hard
        - Smart
        - Don't know / not relevant
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: A screenshot of the chat with its tool calls open helps a lot. Hide anything private.
