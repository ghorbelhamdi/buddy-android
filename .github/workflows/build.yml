name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

jobs:
  # buddy-run's translation of each agent's output, on recorded runs (linux/test/run.sh); jq comes with the runner
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the helper on recorded agent output
        run: bash linux/test/run.sh

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Release signing is optional: add the BUDDY_KEYSTORE_BASE64 and BUDDY_KEYSTORE_PASSWORD
      # repository secrets to get a signed APK; otherwise the APK is unsigned.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BUDDY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (GitHub) and bundle (Google Play)
        env:
          BUDDY_KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          cp "$apk" "dist/buddy-${GITHUB_REF_NAME//\//-}.apk"
          # fixed name too, so releases/latest/download/buddy.apk always gets the newest version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then cp "$apk" dist/buddy.apk; fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: buddy-apk
          path: dist/*.apk

      # The Play bundle is never attached to the GitHub release (see below).
      - uses: actions/upload-artifact@v7
        with:
          name: buddy-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab

      # No automatic upload to Google Play: Play turned Buddy down (its accessibility policy), so releases are on
      # GitHub only. The bundle above is still built and kept as an artifact, for a manual upload if that changes.

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # a release made by hand first (with its own notes) just gets the CI-built APKs attached
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Buddy $GITHUB_REF_NAME" --generate-notes
          fi
