// ------------------------------------------------------------ what the agent runs now, and Stop

let runOpen = false, runData = null, runAt = 0, runTimer = null;

/** Asks the phone every 2 s while the panel is open and the chat works. */
async function fetchRun() {
  clearTimeout(runTimer);
  drawRun();
  if (!runOpen || !open) return;
  const id = open;
  try { const r = await api('/web/run?id=' + encodeURIComponent(id)); if (open === id && runOpen) { runData = r; runAt = Date.now(); } } catch (e) {}
  drawRun();
  if (runOpen && open === id && (!runData || runData.running)) runTimer = setTimeout(fetchRun, 2000);
}

function clock(s) { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

function drawRun() {
  const box = $('run');
  if (!box) return;
  box.textContent = '';
  if (!runOpen) return;
  const r = runData, card = el('div', {class: 'card run', role: 'group', 'aria-label': 'Running now'},
    el('div', {class: 'row', style: 'align-items:center'}, el('span', {class: 'lab', style: 'flex:1'}, 'RUNNING NOW'),
      el('button', {class: 'btn small', onclick: () => { runOpen = false; fetchRun(); }}, 'Close')));
  if (!r) card.append(el('div', {class: 'working'}, el('span', {class: 'spin'}), 'Looking…'));
  else if (r.error) card.append(el('div', {class: 'muted'}, r.error));
  else if (!r.running) card.append(el('div', {class: 'muted'}, 'This chat isn’t working any more.'));
  else {
    if (r.cmd) card.append(el('pre', {}, r.cmd), el('div', {}, 'Running for ' + clock(r.since + (Date.now() - runAt) / 1000)));
    else card.append(el('div', {class: 'muted'}, 'The agent isn’t running a command right now.'));
    if (r.procs && r.procs.length) {
      const list = el('div', {class: 'procs'});
      for (const p of r.procs) list.append(el('div', {class: 'proc', style: 'padding-inline-start:' + 14 * Math.min(p.depth, 4) + 'px'},
        el('div', {class: 'a'}, el('code', {}, p.args), el('small', {}, 'pid ' + p.pid + ' · running ' + clock(p.seconds) + (p.cpu > 0 ? ' · CPU ' + clock(p.cpu) : ''))),
        p.depth === 0 ? el('button', {class: 'btn small deny', onclick: () => stopRun(p.pid)}, 'Stop') : null));
      card.append(list);
    } else if (r.procs) card.append(el('div', {class: 'muted'}, 'Nothing is running under the agent right now.'));
    card.append(el('div', {class: 'note'}, 'A command’s output isn’t shown here: the agent gets it when the command ends.'));
  }
  box.append(card);
}

/** Stop: the whole run, or with a pid one process the agent started (and what that started). */
async function stopRun(pid) {
  if (!open) return;
  try {
    const r = await api('/web/stop', pid ? {chat: open, pid} : {chat: open});
    say(r.error || '');
  } catch (e) { say(e.message); }
  if (runOpen) fetchRun();
}

function cardView(card, from) {

    const typed = el('div', {class: 'change', hidden: true}, own, el('button', {class: 'btn primary', onclick: () => { if (own.value.trim()) answer({change: own.value.trim()}); }}, 'Send'));
    own.addEventListener('keydown', e => { if (e.key === 'Enter' && own.value.trim()) answer({change: own.value.trim()}); });
    const more = el('div', {class: 'row'},
      el('button', {class: 'btn', onclick: () => answer({approve: false})}, 'Skip'),
      el('button', {class: 'btn', onclick: () => { typed.hidden = !typed.hidden; if (!typed.hidden) own.focus(); }}, 'Type my own answer'));
    box.append(row, more, typed);
  } else {
    const what = el('input', {placeholder: 'What should it change?', 'aria-label': 'What should it change?'});
    const tell = el('div', {class: 'change', hidden: true}, what, el('button', {class: 'btn primary', onclick: () => { if (what.value.trim()) answer({change: what.value.trim()}); }}, 'Send'));
    what.addEventListener('keydown', e => { if (e.key === 'Enter' && what.value.trim()) answer({change: what.value.trim()}); });
    row.append(el('button', {class: 'btn deny', onclick: () => answer({approve: false})}, 'Deny'),
      el('button', {class: 'btn', onclick: () => { tell.hidden = !tell.hidden; if (!tell.hidden) what.focus(); }}, 'Change'),
      el('button', {class: 'btn primary', onclick: () => answer({approve: true})}, 'Approve'));
    box.append(row, tell);

let sending = false;
async function sendIt() {
  const ta = $('msg'), typed = ta.value.trim();
  if (atts.some(a => a.busy)) { say('Wait for the files to finish uploading.'); return; }
  const ok = atts.filter(a => a.id || a.path);
  if ((!typed && !ok.length) || sending) return;
  // (a quote goes in as Markdown above the text, the way the app sends one)
  const text = quoted && typed ? quoted.split('\n').map(l => '> ' + l).join('\n') + '\n\n' + typed : typed;
  const files = ok.filter(a => a.id).map(a => a.id), linux = ok.filter(a => a.path).map(a => a.path);
  sending = true; $('send').disabled = true; say('');
  try {
    const r = await api('/web/send', Object.assign(open ? (chatData && chatData.team ? {chat: open, text, to: [...sendTo]} : {chat: open, text})
      : draft ? {text, agent: draft.agent, model: draft.model, dev: draft.dev, background: draft.background} : {text}, {files, linux}));
    if (r.error) { say(r.error); return; }
    ta.value = ''; grow(ta); setQuote(null); clearAtts();
    if (r.chat && r.chat !== open) { open = r.chat; shown = PAGE; unfolded.clear(); }
    toBottom = true; drawn = '';
    chatData = await api('/web/chat?id=' + encodeURIComponent(open));
    render();
  } catch (e) { say(e.message); }
  finally { sending = false; canSend(); }
}

function canSend() { $('send').disabled = !$('msg').value.trim() && !atts.some(a => a.id || a.path); }

// ------------------------------------------------------------ files with a message, and files on messages

// what goes with the next message: {name, size, busy, id (an attachment), path (in the chat's Linux tools), error, xhr, done}
let atts = [];

/** Sends each file to the phone as it's picked (any size: over 25 MB it goes to the chat's Linux tools, if it has them). */
function attach(list) {
  for (const f of list) {
    const a = {name: f.name, size: f.size, busy: true, done: 0};
    atts.push(a);
    const x = new XMLHttpRequest();
    a.xhr = x;
    x.open('POST', '/web/upload?to=attach&name=' + encodeURIComponent(f.name) + (open ? '&chat=' + encodeURIComponent(open) : ''));
    x.setRequestHeader('Authorization', 'Bearer ' + key);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) { a.done = e.loaded / e.total; if (a.bar) a.bar.value = a.done; } };
    x.onload = () => {
      a.busy = false;
      let r = {};
      try { r = JSON.parse(x.responseText); } catch (e) { r = {error: 'The phone didn’t take it (' + x.status + ').'}; }
      if (r.error) a.error = r.error; else if (r.id) a.id = r.id; else a.path = r.path;
      drawAtts(); canSend();
    };
    x.onerror = () => { a.busy = false; a.error = 'The upload stopped.'; drawAtts(); canSend(); };
    x.send(f);
  }
  drawAtts(); canSend();
}

function clearAtts() { for (const a of atts) if (a.busy && a.xhr) a.xhr.abort(); atts = []; drawAtts(); }

function drawAtts() {
  const box = $('atts');
  if (!box) return;
  box.textContent = '';
  for (const a of atts) {
    a.bar = a.busy ? el('progress', {max: '1', value: String(a.done)}) : null;
    box.append(el('div', {class: 'att' + (a.error ? ' err' : ''), title: a.error || (a.path ? 'Goes to the chat’s Linux tools: ' + a.path : a.name)},
      icon(a.path ? I.folder : I.attach, 16), el('span', {}, a.error ? a.name + ': ' + a.error : a.name), a.bar,
      el('button', {'aria-label': 'Remove ' + a.name, onclick: () => { if (a.busy && a.xhr) a.xhr.abort(); atts = atts.filter(x => x !== a); drawAtts(); canSend(); }}, icon(I.x, 14))));
  }
}

const pics = new Map(); // a picture attachment's id → its address in this page (fetched once, with the key)

/** A message's files: pictures shown, other files as chips that download (by a one-use link). */
function msgFiles(r) {
  if (!(r.f && r.f.length) && !(r.lx && r.lx.length)) return null;
  const box = el('div', {class: 'mfiles'}), chat = open;
  for (const f of r.f || []) {
    if (f.image) {
      const img = el('img', {alt: f.name, title: f.name, loading: 'lazy', onclick: () => enlarge(img.src, f.name, {att: f.id, chat})});
      box.append(img);
      if (pics.has(f.id)) img.src = pics.get(f.id);
      else fetch('/web/pic?chat=' + encodeURIComponent(chat) + '&id=' + encodeURIComponent(f.id), {headers: {Authorization: 'Bearer ' + key}})
        .then(x => x.ok ? x.blob() : null).then(b => { if (b) { const u = URL.createObjectURL(b); pics.set(f.id, u); img.src = u; } }).catch(() => {});
    } else box.append(el('button', {class: 'fchip', title: 'Download ' + f.name, onclick: () => download({att: f.id, chat})}, icon(I.file, 16), el('span', {}, f.name)));
  }
  for (const p of r.lx || []) {
    const name = p.split('/').pop();
    box.append(el('button', {class: 'fchip', title: p + ' · click to download', onclick: () => download({path: p, chat})}, icon(I.folder, 16), el('span', {}, name)),
      el('button', {class: 'fchip', title: 'Show it in this chat’s files', onclick: () => { const t = chatData && chatData.title; openView('files', chat, t); goFiles(p.slice(0, p.lastIndexOf('/'))); }}, el('span', {}, 'Show in Files')));
  }
  return box;
}

/** A picture large, over the page, with Download. */
function enlarge(src, name, what) {
  if (!src) return;
  sheet((box, close) => {
    box.parentNode.classList.add('lightbox');
    box.append(el('img', {src, alt: name}),
      el('div', {class: 'line', style: 'justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap'},
        el('span', {class: 'muted', style: 'align-self:center;font-size:13px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}, name),
        el('button', {class: 'btn primary', style: 'display:flex;align-items:center;gap:6px', onclick: () => download(what)}, icon(I.download, 16), 'Download'),
        el('button', {class: 'btn', onclick: close}, 'Close')));
  });
}

/** A download by a plain link: the phone gives a one-use ticket for it first (a link can't carry the key). */
async function download(what) {
  try {
    const r = await api('/web/ticket', what);
    if (r.error) { say(r.error); return; }
    const a = el('a', {href: '/web/dl?t=' + r.t, download: ''});
    document.body.append(a); a.click(); a.remove();
  } catch (e) { say(e.message); }
}

// ---- a chat's hidden screen, small, at the side of the chat (hidden there per chat, as this browser remembers)

let panelFor = null, panelGen = 0;

function panelHidden(id) { try { return (localStorage.getItem('buddy-nopanel') || '').split(',').includes(id); } catch (e) { return false; } }

function panelHide(id, hide) {
  try {
    const l = (localStorage.getItem('buddy-nopanel') || '').split(',').filter(x => x && x !== id);
    if (hide) l.push(id);
    localStorage.setItem('buddy-nopanel', l.slice(-200).join(','));
  } catch (e) {}
  panelFor = null; drawn = ''; render();
}

function drawPanel(d) {
  const show = !!(d && d.screen && !view && !panelHidden(open));
  $('scrpanel').hidden = !show;
  document.querySelector('.chat').classList.toggle('withpanel', show); // (the chat moves over, so the picture covers none of it)
  if (!show) { panelFor = null; panelGen++; return; }
  if (panelFor === open) return; // (its loop is at it)
  panelFor = open;
  const g = ++panelGen, id = open;
  $('scrpic').textContent = 'Loading…';
  (async () => {
    while (g === panelGen) {
      if (!document.hidden) {
        try {
          const x = await fetch('/web/shot?id=' + encodeURIComponent(id) + '&w=360', {headers: {Authorization: 'Bearer ' + key}});
          if (g !== panelGen) return;
          const box = $('scrpic');
          if (x.ok) {
            const u = URL.createObjectURL(await x.blob());
            let img = box.querySelector('img');
            if (!img) { box.textContent = ''; img = el('img', {alt: 'Hidden screen'}); box.append(img); }
            const old = img.src;
            img.src = u;
            if (old.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(old), 1000);
          } else { let why = 'Nothing to show yet.'; try { why = (await x.json()).error || why; } catch (e) {} box.textContent = why; }
        } catch (e) {}
      }
      if (!rate) return;
      await new Promise(r => setTimeout(r, Math.max(rate, 2000)));
    }
  })();
}

function leaveView() { view = null; viewGen++; for (const u of shots.values()) URL.revokeObjectURL(u); shots.clear(); }

function viewHead(title) {
  $('title').textContent = title;
  for (const id of ['agent', 'optbtn', 'scrchip', 'devchip', 'bgchip', 'work', 'runbtn', 'stopbtn']) $(id).hidden = true;
  $('scrpanel').hidden = true; panelFor = null; panelGen++; document.querySelector('.chat').classList.remove('withpanel');
  document.title = title + ' · Buddy';
}

async function loadView() {
  const g = viewGen;
  try {
    if (view === 'files') {
      const asked = fsv.path; // (another folder opened meanwhile: this answer is for the one before)
      const d = fsv.path ? await api('/web/files?path=' + encodeURIComponent(fsv.path) + (fsv.chat ? '&chat=' + encodeURIComponent(fsv.chat) : '') + (fsv.hidden ? '&hidden=1' : ''))
        : await api('/web/places' + (fsv.chat ? '?chat=' + encodeURIComponent(fsv.chat) : ''));
      if (g === viewGen && fsv.path === asked) { if (d.path && asked && d.path !== asked && asked.startsWith(d.path + '/')) fsv.path = d.path; /* (a file: its folder) */ fsv.data = d; viewDrawn = ''; drawView(); }
    } else if (view === 'screens') {
      const d = await api('/web/screens');
      if (g === viewGen) { scr.list = d; viewDrawn = ''; drawView(); shotLoop(g); }
    } else if (view === 'plans') {
      const d = await api('/web/plans');
      if (g === viewGen) { plansData = d; viewDrawn = ''; drawView(); }
    } else if (view === 'devices') {
      const d = await api('/web/devices');
      if (g === viewGen) { devData = d; viewDrawn = ''; drawView(); }
    }
  } catch (e) { say(e.message); }
}

function drawView() {
  viewHead(view === 'files' ? (fsv.chat ? 'Files · ' + (fsv.title || 'this chat') : 'Files') : view === 'screens' ? 'Screens'
    : view === 'devices' ? 'Devices and computers' : 'Schedules and routines');
  const k = JSON.stringify([view, view === 'files' ? [fsv.path, fsv.data, fsv.hidden, ups.map(u => [u.name, u.error, u.busy])] : view === 'screens' ? [scr.list, scr.big]
    : view === 'devices' ? devData : plansData]);
  if (k === viewDrawn) return; // (an upload's bar moves on its own; the list stays as it is)
  viewDrawn = k;
  const col = $('col');
  col.textContent = '';
  if (view === 'files') drawFiles(col); else if (view === 'screens') drawScreens(col); else if (view === 'devices') drawDevices(col); else drawPlans(col);
  $('pane').scrollTop = 0;
  jump();
}

// ---- Files: the same places as the Files screen in the app

let fsv = null, ups = [];

function size(n) {
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
}

function goFiles(path) { fsv.path = path; fsv.data = null; viewDrawn = ''; drawView(); loadView(); }

function drawFiles(col) {
  const d = fsv.data;
  const crumbs = el('div', {class: 'crumbs'}, el('button', {onclick: () => goFiles(null)}, fsv.chat ? 'This chat' : 'Places'));
  if (fsv.path) {
    const parts = fsv.path.split('/').filter(Boolean);
    // from the place it's in (the workspace, or a chat's folder), not from /
    const inWork = fsv.path === '/root/.buddy/work' || fsv.path.startsWith('/root/.buddy/work/');
    const base = inWork ? 3 : Math.min(parts.length, 5);
    for (let i = base - 1; i < parts.length; i++) {
      const p = '/' + parts.slice(0, i + 1).join('/');
      const label = i === base - 1 ? (inWork ? 'Workspace' : parts[i] === 'incoming' ? 'Sent to Linux tools' : parts[i] === 'files' ? 'Attachments' : parts[i]) : parts[i];
      crumbs.append('/', el('button', {onclick: () => goFiles(p)}, label));
    }
  }
  const pick = el('input', {type: 'file', multiple: true, hidden: true, onchange: e => { upload([...e.target.files]); e.target.value = ''; }});
  const bar = el('div', {class: 'bar'}, crumbs, el('span', {class: 'grow'}));
  if (fsv.path && d && !d.error) {
    const up = icon(I.download, 16);
    up.style.transform = 'rotate(180deg)';
    bar.append(el('label', {class: 'muted', style: 'display:flex;align-items:center;gap:6px;font-size:13px'},
      el('input', {type: 'checkbox', checked: fsv.hidden, onchange: e => { fsv.hidden = e.target.checked; loadView(); }, style: 'min-height:0'}), 'Hidden files'),
      el('button', {class: 'btn small', onclick: () => newFolder()}, 'New folder'),
      el('button', {class: 'btn small primary', style: 'display:flex;align-items:center;gap:6px', onclick: () => pick.click()}, up, 'Upload'), pick);
  }
  col.append(bar);
  if (ups.length) {
    const box = el('div', {class: 'ups'});
    for (const u of ups) {
      u.bar = u.busy ? el('progress', {max: '1', value: String(u.done)}) : null;
      box.append(el('div', {class: 'up'}, el('span', {class: 'nm'}, u.name + ' · ' + size(u.size)), u.bar,
        u.error ? el('span', {style: 'color:var(--err)'}, u.error) : u.busy ? null : el('span', {class: 'muted'}, 'Done'),
        u.busy ? el('button', {class: 'btn small', onclick: () => u.xhr.abort()}, 'Cancel')
          : el('button', {class: 'btn small', onclick: () => { ups = ups.filter(x => x !== u); viewDrawn = ''; drawView(); }}, 'OK')));
    }
    col.append(box);
  }
  if (!d) { col.append(el('div', {class: 'working'}, el('span', {class: 'spin'}), 'Looking…')); return; }
  if (d.error) { col.append(el('div', {class: 'error'}, d.error)); return; }
  const list = el('div', {class: 'files'});
  if (!fsv.path) {
    col.append(el('p', {class: 'muted', style: 'margin:0'}, fsv.chat
      ? 'This chat’s files in Buddy’s Linux: where its agent works, what was sent to its Linux tools, and its attachments.'
      : 'What’s in Buddy’s Linux, where agents with Linux tools work. Upload a file into a folder for them, or take out what they made. A chat’s own files are in its menu (⋯ → Files).'));
    for (const p of d.places) list.append(el('div', {class: 'frow'}, el('button', {class: 'nm', onclick: () => goFiles(p.path)},
      el('span', {class: 'tile dir'}, icon(I.folder, 18)), el('span', {}, p.name, el('small', {}, p.about)))));
    col.append(list);
    return;
  }
  if (d.busy) col.append(el('p', {class: 'muted', style: 'margin:0'}, 'A file is being copied in here from the phone.'));
  for (const e of d.entries) {
    const path = d.path + '/' + e.name;
    const ops = el('div', {class: 'ops'});
    if (!e.dir && !e.link) ops.append(el('button', {'aria-label': 'Download ' + e.name, title: 'Download', onclick: () => download({path, chat: fsv.chat})}, icon(I.download, 18)));
    ops.append(el('button', {'aria-label': 'Rename ' + e.name, title: 'Rename', onclick: () => renameFile(path, e.name)}, icon(I.edit, 18)),
      el('button', {'aria-label': 'Delete ' + e.name, title: 'Delete', onclick: () => deleteFile(path, e.name, e.dir)}, icon(I.trash, 18)));
    const about = e.link ? 'Link to ' + e.to : (e.dir ? '' : size(e.size) + ' · ') + when(e.time);
    list.append(el('div', {class: 'frow'}, el('button', {class: 'nm', title: e.dir ? 'Open' : 'Download',
        onclick: () => e.dir && !e.link ? goFiles(path) : !e.link ? download({path, chat: fsv.chat}) : null},
      el('span', {class: 'tile' + (e.dir ? ' dir' : '')}, icon(e.dir ? I.folder : I.file, 18)), el('span', {}, e.name, el('small', {}, about))), ops));
  }
  if (!d.entries.length) list.append(el('div', {class: 'frow muted'}, 'Nothing here yet.'));
  col.append(list);
  if (d.hidden) col.append(el('p', {class: 'muted', style: 'margin:0;font-size:13px'}, d.hidden + (d.hidden === 1 ? ' hidden file' : ' hidden files') + ' not shown.'));
  if (d.more) col.append(el('p', {class: 'muted', style: 'margin:0;font-size:13px'}, d.more + ' more not shown.'));
}

/** Files into the folder shown, at any size, each with its bar and Cancel; a name that's taken gets " (2)". */
function upload(list) {
  const path = fsv.path, chat = fsv.chat;
  for (const f of list) {
    const u = {name: f.name, size: f.size, busy: true, done: 0};
    ups.push(u);
    const x = new XMLHttpRequest();
    u.xhr = x;
    x.open('POST', '/web/upload?to=files&dir=' + encodeURIComponent(path) + '&name=' + encodeURIComponent(f.name) + (chat ? '&chat=' + encodeURIComponent(chat) : ''));
    x.setRequestHeader('Authorization', 'Bearer ' + key);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) { u.done = e.loaded / e.total; if (u.bar) u.bar.value = u.done; } };
    const fin = err => { u.busy = false; u.error = err; viewDrawn = ''; if (view === 'files') { if (fsv.path === path) loadView(); else drawView(); } };
    x.onload = () => { let r = {}; try { r = JSON.parse(x.responseText); } catch (e) { r = {error: 'The phone didn’t take it (' + x.status + ').'}; } fin(r.error || null); };
    x.onerror = () => fin('The upload stopped.');
    x.onabort = () => fin('Cancelled');
    x.send(f);
  }
  viewDrawn = ''; drawView();
}

async function fsChange(body) {
  try { const r = await api('/web/fs', Object.assign({chat: fsv.chat}, body)); say(r.error || ''); } catch (e) { say(e.message); }
  loadView();
}

function newFolder() {
  sheet((box, close) => {
    const name = el('input', {placeholder: 'Name', 'aria-label': 'Folder name'});
    const go = () => { const n = name.value.trim(); if (!n) return; close(); fsChange({op: 'mkdir', path: fsv.path, name: n}); };
    name.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    box.append(el('h2', {}, 'New folder'), el('div', {class: 'line'}, name, el('button', {class: 'btn primary', onclick: go}, 'Create')));
    setTimeout(() => name.focus(), 0);
  });
}

function renameFile(path, old) {
  sheet((box, close) => {
    const name = el('input', {value: old, 'aria-label': 'New name'});
    const go = () => { const n = name.value.trim(); close(); if (n && n !== old) fsChange({op: 'rename', path, name: n}); };
    name.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    box.append(el('h2', {}, 'Rename'), el('div', {class: 'line'}, name, el('button', {class: 'btn primary', onclick: go}, 'Save')));
    setTimeout(() => { name.focus(); const dot = old.lastIndexOf('.'); name.setSelectionRange(0, dot > 0 ? dot : old.length); }, 0);
  });
}

function deleteFile(path, name, dir) {
  sheet((box, close) => {
    box.append(el('h2', {}, 'Delete “' + name + '”?'),
      el('p', {}, (dir ? 'The folder and everything in it are' : 'It’s') + ' deleted from the phone for good.'),
      el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:8px'}, el('button', {class: 'btn', onclick: close}, 'Cancel'),
        el('button', {class: 'btn deny', onclick: () => { close(); fsChange({op: 'delete', path}); }}, 'Delete')));
  });
}

// ---- Screens: to look at, not to touch

let scr = null;
const shots = new Map(); // a screen → the address of its newest picture
// how often the pictures come (ms; 0: paused), kept in this browser. The phone's own screen comes at most about once a
// second whatever is set: Android lets an app take no more
let rate = 2000;
try { rate = Number(localStorage.getItem('buddy-rate') || 2000); } catch (e) {}
const RATES = [[1000, 'Every second'], [2000, 'Every 2 seconds'], [5000, 'Every 5 seconds'], [10000, 'Every 10 seconds'], [30000, 'Every 30 seconds'], [0, 'Paused']];

function rateBox() {
  const s = el('select', {'aria-label': 'How often the screens refresh', class: 'rate', onchange: e => {
    rate = Number(e.target.value);
    try { localStorage.setItem('buddy-rate', String(rate)); } catch (x) {}
    if (rate) { viewGen++; shotLoop(viewGen); } // (at once, not after the old wait)
    panelFor = null; panelGen++; // (a chat's small screen starts again at the new rate too)
  }});
  for (const [ms, name] of RATES) s.append(el('option', {value: String(ms), selected: ms === rate}, name));
  return el('label', {class: 'muted', style: 'display:flex;align-items:center;gap:8px;font-size:13px'}, 'Refresh', s);
}

function drawScreens(col) {
  const d = scr.list;
  if (!d) { col.append(el('div', {class: 'working'}, el('span', {class: 'spin'}), 'Looking…')); return; }
  if (d.off) { col.append(el('p', {class: 'muted'}, 'Screens are off for other devices. They’re turned on in Settings → Other devices on the phone.')); return; }
  col.append(el('div', {class: 'bar'}, el('p', {class: 'muted', style: 'margin:0;flex:1 1 320px'}, 'The phone’s screen and the hidden screens agents work on. To look at only: they can’t be used from here. While a money app is in front, its screen is only shown on the phone.'), rateBox()));
  if (scr.big) {
    const s = scr.big === 'phone' ? {title: 'Phone screen'} : (d.screens.find(x => x.chat === scr.big) || {title: 'This screen has closed'});
    col.append(el('div', {class: 'bar'}, el('button', {class: 'btn small', style: 'display:flex;align-items:center;gap:6px', onclick: () => { scr.big = null; viewDrawn = ''; drawView(); }}, icon(I.back, 16), 'All screens'),
      el('b', {}, s.title + (s.app ? ' · ' + s.app : '')), el('span', {class: 'grow'}),
      scr.big !== 'phone' && state && state.chats.find(c => c.id === scr.big) ? el('button', {class: 'btn small', onclick: () => show(scr.big)}, 'Open the chat') : null));
    col.append(el('div', {class: 'big'}, pic(scr.big)));
    restartShots();
    return;
  }
  const grid = el('div', {class: 'grid'}), hid = hiddenShots();
  // a tile: its picture opens it large; under it, hide it from this page and, for a chat's hidden screen, close that screen
  const tile = (id, title, sub, closable) => el('div', {class: 'shot'},
    pic(id, true),
    el('b', {}, title), sub ? el('small', {}, sub) : null,
    el('div', {class: 'hb'}, el('button', {title: 'Not shown on this page until you show it again', onclick: () => { hideShot(id, true); }}, 'Hide'),
      closable ? el('button', {title: 'Ends this hidden screen on the phone (with what’s open on it)', onclick: () => closeScreen(id, title)}, 'Close screen') : null));
  let hidden = 0;
  if (d.phone) { if (hid.includes('phone')) hidden++; else grid.append(tile('phone', 'Phone screen', 'What the phone shows now', false)); }
  for (const s of d.screens) {
    if (hid.includes(s.chat)) { hidden++; continue; }
    grid.append(tile(s.chat, s.title, (s.app || 'Hidden screen') + (s.running ? ' · working' : ''), !s.running));
  }
  col.append(grid);
  if (hidden) col.append(el('p', {class: 'muted', style: 'margin:0;font-size:13px'}, hidden + (hidden === 1 ? ' screen hidden on this page. ' : ' screens hidden on this page. '),
    el('button', {class: 'btn small', onclick: () => { try { localStorage.removeItem('buddy-noshot'); } catch (e) {} viewDrawn = ''; drawView(); }}, 'Show them')));
  if (!d.phone && !d.screens.length) col.append(el('p', {class: 'muted'}, 'Nothing to show: Buddy’s accessibility isn’t on on the phone.'));
  else if (!d.screens.length) col.append(el('p', {class: 'muted', style: 'margin:0;font-size:13px'}, 'No hidden screen is open. A chat in background mode gets one when its agent uses the phone.'));
  restartShots();
}

/** A screen's picture box: the last picture it had, if any, at once (a new one comes right after). */
function pic(id, button) {
  const kids = shots.has(id) ? [el('img', {alt: 'Screen', src: shots.get(id)})] : ['Loading…'];
  return button ? el('button', {class: 'pic', 'data-shot': id, title: 'Show it large', onclick: () => { scr.big = id; viewDrawn = ''; drawView(); }}, ...kids)
    : el('div', {class: 'pic', 'data-shot': id}, ...kids);
}

/** The pictures fetched again now, for the boxes just drawn (and on at the chosen rate; paused: once). */
function restartShots() {
  const g = ++viewGen;
  setTimeout(() => shotLoop(g), 0);
}

function hiddenShots() { try { return (localStorage.getItem('buddy-noshot') || '').split(',').filter(Boolean); } catch (e) { return []; } }

function hideShot(id, hide) {
  try { const l = hiddenShots().filter(x => x !== id); if (hide) l.push(id); localStorage.setItem('buddy-noshot', l.join(',')); } catch (e) {}
  viewDrawn = ''; drawView();
}

function closeScreen(chat, title) {
  sheet((box, close) => box.append(el('h2', {}, 'Close this hidden screen?'),
    el('p', {}, '“' + title + '”’s hidden screen ends on the phone, with the app open on it. The chat stays; its agent gets a new screen when it next uses the phone.'),
    el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:8px'}, el('button', {class: 'btn', onclick: close}, 'Cancel'),
      el('button', {class: 'btn deny', onclick: async () => {
        close();
        try { const r = await api('/web/close-screen', {chat}); say(r.error || ''); } catch (e) { say(e.message); }
        loadView();
      }}, 'Close screen'))));
}

/** Fetches the pictures of the screens shown, one after another, while this view is open and the page is in front. */
async function shotLoop(g) {
  let n = 0;
  while (g === viewGen && view === 'screens') {
    if (!document.hidden) {
      for (const box of [...document.querySelectorAll('[data-shot]')]) {
        if (g !== viewGen) return;
        const id = box.dataset.shot, big = !!scr.big;
        try {
          const x = await fetch('/web/shot?id=' + encodeURIComponent(id) + '&w=' + (big ? 1080 : 420), {headers: {Authorization: 'Bearer ' + key}});
          if (g !== viewGen || !box.isConnected) continue;
          if (x.ok) {
            const u = URL.createObjectURL(await x.blob()), old = shots.get(id);
            shots.set(id, u);
            let img = box.querySelector('img');
            if (!img) { box.textContent = ''; img = el('img', {alt: 'Screen'}); box.append(img); }
            img.src = u;
            if (old) setTimeout(() => URL.revokeObjectURL(old), 5000);
          } else {
            let why = 'Nothing to show yet.';
            try { why = (await x.json()).error || why; } catch (e) {}
            box.textContent = why;
          }
        } catch (e) {}
      }
    }
    // the list of screens again now and then (a hidden screen opens or closes)
    if (++n % 10 === 0 && g === viewGen) {
      try { const d = await api('/web/screens'); if (g === viewGen && JSON.stringify(d) !== JSON.stringify(scr.list)) { scr.list = d; viewDrawn = ''; drawView(); } } catch (e) {}
    }
    // paused: nothing is fetched until another rate is picked (which starts this again)
    if (!rate) return;
    await new Promise(r => setTimeout(r, rate));
  }
}

// ---- Devices and computers

let devData = null;

function drawDevices(col) {
  const d = devData;
  if (!d) { col.append(el('div', {class: 'working'}, el('span', {class: 'spin'}), 'Looking…')); return; }
  col.append(el('h2', {class: 'sec'}, 'Paired devices'));
  const list = el('div', {class: 'files'});
  for (const x of d.devices) {
    list.append(el('div', {class: 'frow'}, el('span', {class: 'nm'}, el('span', {class: 'tile'}, icon(I.devices, 18)),
        el('span', {}, x.name, x.me ? el('span', {class: 'tag'}, 'This browser') : null, el('small', {}, 'Last seen ' + when(x.seen)))),
      el('button', {class: 'btn small deny', onclick: () => confirmRemove('Remove “' + x.name + '”?', x.me
        ? 'This browser is out at once, and pairs again only with a code you approve on the phone.'
        : 'It’s out at once. To come back it pairs again, with a code you approve on the phone.', 'Remove', async () => {
          try { await api('/web/device-remove', {id: x.id}); } catch (e) {}
          if (x.me) forget(); else loadView();
        })}, 'Remove')));
  }
  col.append(list, el('p', {class: 'muted', style: 'margin:0;font-size:13px'}, 'To add a device, open this page’s address on it and click Pair. You approve it on the phone, with the same code.'));

  col.append(el('h2', {class: 'sec', style: 'margin-top:18px'}, 'Computers'),
    el('p', {class: 'muted', style: 'margin:0'}, 'Agents run commands on your own computers over SSH, the way you would in a terminal. Every command shows on a card first.'));
  if (d.computers.length) {
    const cl = el('div', {class: 'files'});
    for (const m of d.computers) cl.append(el('div', {class: 'frow'}, el('span', {class: 'nm'}, el('span', {class: 'tile'}, icon(I.devices, 18)),
        el('span', {}, m.name, el('small', {}, m.where))),
      el('button', {class: 'btn small deny', onclick: () => confirmRemove('Remove “' + m.name + '”?',
        'Agents can’t reach it any more. Buddy’s key stays in its authorized_keys until you take it out there.', 'Remove', async () => {
          try { await api('/web/computer-remove', {id: m.id}); } catch (e) {}
          loadView();
        })}, 'Remove')));
    col.append(cl);
  }
  col.append(addComputer(d));
}

function confirmRemove(title, text, yes, run) {
  sheet((box, close) => box.append(el('h2', {}, title), el('p', {}, text),
    el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:8px'}, el('button', {class: 'btn', onclick: close}, 'Cancel'),
      el('button', {class: 'btn deny', onclick: () => { close(); run(); }}, yes))));
}

/** Adding a computer: its details, Buddy's key to copy onto it, and the phone's OK (a card there), then a try. */
function addComputer(d) {
  const box = el('div', {class: 'pcard'});
  box.append(el('span', {class: 't'}, 'Add a computer'));
  if (!d.linux) { box.append(el('div', {class: 'w'}, 'This needs Buddy’s Linux: install it on the phone first.')); return box; }
  const f = (label, attrs) => { const i = el('input', Object.assign({'aria-label': label, placeholder: label}, attrs)); return [i, el('label', {style: 'display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 180px'}, label, i)]; };
  const [name, nl] = f('Name', {value: 'My computer', maxlength: '40'}), [host, hl] = f('Address (its Tailscale name or IP)', {}),
    [user, ul] = f('Your user name on it', {}), [port, pl] = f('Port', {value: '22', inputmode: 'numeric', style: 'max-width:110px'});
  const keyBox = el('pre', {style: 'margin:0;background:var(--bg);border-radius:12px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere'}, 'Getting Buddy’s key…');
  const copyBtn = el('button', {class: 'btn small', disabled: true}, icon(I.copy, 16), 'Copy the key');
  copyBtn.style.cssText = 'display:flex;align-items:center;gap:6px;align-self:flex-start';
  const status = el('div', {class: 'w', role: 'status'});
  const go = el('button', {class: 'btn primary', style: 'align-self:flex-start'}, 'Add, and approve it on the phone');
  box.append(el('div', {class: 'row'}, nl, hl), el('div', {class: 'row'}, ul, pl),
    el('div', {class: 'w'}, 'Put Buddy’s key on the computer: add this line to ~/.ssh/authorized_keys there. On Windows, turn on OpenSSH Server and use C:\\Users\\<you>\\.ssh\\authorized_keys, or C:\\ProgramData\\ssh\\administrators_authorized_keys for an administrator account.'),
    keyBox, copyBtn, go, status);
  api('/web/computer-key', {}).then(r => {
    if (r.error) { keyBox.textContent = r.error; return; }
    keyBox.textContent = r.key; copyBtn.disabled = false;
    copyBtn.onclick = e => copy(r.key, e.currentTarget);
  }).catch(e => { keyBox.textContent = e.message; });
  go.onclick = async () => {
    go.disabled = true;
    status.textContent = 'Approve it on your phone: a card asks there. Then Buddy tries to get in…';
    status.style.color = '';
    try {
      const r = await api('/web/computer-add', {name: name.value, host: host.value, user: user.value, port: Number(port.value) || 22});
      if (r.error) { status.textContent = r.error; status.style.color = 'var(--err)'; }
      else { status.textContent = 'Added. Agents can use it now: each command asks first.'; loadView(); }
    } catch (e) { status.textContent = e.message; status.style.color = 'var(--err)'; }
    go.disabled = false;
  };
  return box;
}

// ---- Schedules and routines

let plansData = null;

function confirmDelete(title, text, run) {
  sheet((box, close) => box.append(el('h2', {}, title), el('p', {}, text),
    el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:8px'}, el('button', {class: 'btn', onclick: close}, 'Cancel'),
      el('button', {class: 'btn deny', onclick: () => { close(); run(); }}, 'Delete'))));
}

function drawPlans(col) {
  const d = plansData;
  if (!d) { col.append(el('div', {class: 'working'}, el('span', {class: 'spin'}), 'Looking…')); return; }
  col.append(el('div', {class: 'bar'}, el('h2', {class: 'sec', style: 'flex:1'}, 'Schedules'),
    el('button', {class: 'btn small primary', onclick: () => editSchedule(null, '', null)}, 'New schedule')));
  if (!d.schedules.length) col.append(el('p', {class: 'muted', style: 'margin:0'}, 'No chat has a schedule yet. A schedule sends a chat its message at the times you pick.'));
  for (const p of d.schedules) {
    col.append(el('div', {class: 'pcard'},
      el('div', {}, el('span', {class: 't'}, p.title), p.paused ? el('span', {class: 'tag'}, 'Paused') : null, p.running ? el('span', {class: 'tag'}, 'Working') : null),
      el('div', {class: 'x'}, p.text), el('div', {class: 'w'}, p.paused ? 'Doesn’t run while paused' : p.when),
      el('div', {class: 'row'},
        el('button', {class: 'btn small', onclick: () => editSchedule(p.chat, p.title, p)}, 'Edit'),
        el('button', {class: 'btn small', onclick: () => planOp(p.chat, 'run')}, 'Run now'),
        el('button', {class: 'btn small', onclick: () => planOp(p.chat, p.paused ? 'resume' : 'pause')}, p.paused ? 'Resume' : 'Pause'),
        el('button', {class: 'btn small', onclick: () => show(p.chat)}, 'Open the chat'),
        el('button', {class: 'btn small deny', onclick: () => confirmDelete('Delete this schedule?', '“' + p.title + '” stops running on its own. The chat stays.',
          () => planOp(p.chat, 'delete'))}, 'Delete'))));
  }
  col.append(el('h2', {class: 'sec', style: 'margin-top:18px'}, 'Routines'));
  if (!d.routines.length) col.append(el('p', {class: 'muted', style: 'margin:0'}, 'No routines yet. Ask an agent to save what it just did as a routine.'));
  for (const r of d.routines) {
    col.append(el('div', {class: 'pcard'}, el('span', {class: 't'}, r.name), r.about ? el('div', {class: 'x'}, r.about) : null,
      el('div', {class: 'w'}, r.steps + (r.steps === 1 ? ' step' : ' steps') + (r.blanks.length ? ' · asks for ' + r.blanks.join(', ') : '')),
      el('div', {class: 'row'},
        el('button', {class: 'btn small primary', onclick: () => runRoutine(r)}, 'Run on the phone'),
        el('button', {class: 'btn small deny', onclick: () => confirmDelete('Delete “' + r.name + '”?', 'The routine is deleted from the phone.',
          async () => { try { await api('/web/routine', {op: 'delete', name: r.name}); } catch (e) {} loadView(); })}, 'Delete'))));
  }
}

/**
 * A chat's schedule: its message, the times and days it's sent, and whether a run with nothing new tells you. A new
 * one picks its chat. Waking the phone and events are set in the app (waking can take away the lock screen).
 */
async function editSchedule(chat, title, plan) {
  if (chat && plan === undefined) { // (from a chat's menu: what it has now, if anything)
    try { const d = await api('/web/plans'); plan = d.schedules.find(p => p.chat === chat) || null; } catch (e) { plan = null; }
  }
  const p = plan || {text: '', minutes: [9 * 60], days: 127, quiet: false};
  sheet((box, close) => {
    box.append(el('h2', {}, plan ? 'Schedule · ' + title : 'New schedule'));
    let pick = null;
    if (!chat) {
      pick = el('select', {'aria-label': 'Chat'});
      for (const c of (state ? state.chats : []).filter(c => !c.archived)) pick.append(el('option', {value: c.id}, c.title || 'Chat'));
      box.append(el('h3', {}, 'Chat'), pick, el('p', {style: 'margin-top:6px'}, 'The message is sent in this chat, as if you wrote it, and its agent answers there.'));
    }
    const msg = el('textarea', {class: 'big', rows: '4', placeholder: 'What should the agent do each time?', 'aria-label': 'Message'});
    msg.value = p.text;
    box.append(el('h3', {}, 'Message'), msg);
    let times = (p.minutes || [9 * 60]).slice();
    const tbox = el('div', {class: 'times'});
    const fmt = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    const drawTimes = () => {
      tbox.textContent = '';
      times.forEach((m, i) => {
        const t = el('input', {type: 'time', value: fmt(m), 'aria-label': 'Time ' + (i + 1), onchange: e => { const [h, mm] = e.target.value.split(':').map(Number); if (!isNaN(h)) times[i] = h * 60 + (mm || 0); }});
        tbox.append(el('span', {}, t, times.length > 1 ? el('button', {'aria-label': 'Remove this time', onclick: () => { times.splice(i, 1); drawTimes(); }}, icon(I.x, 14)) : null));
      });
      if (times.length < 12) tbox.append(el('button', {class: 'btn small', onclick: () => { times.push(times[times.length - 1] || 540); drawTimes(); }}, '+ Add a time'));
    };
    drawTimes();
    box.append(el('h3', {}, 'Times'), tbox);
    let days = p.days || 127;
    const dbox = el('div', {class: 'days'});
    const DAYS = [['Mon', 1], ['Tue', 2], ['Wed', 3], ['Thu', 4], ['Fri', 5], ['Sat', 6], ['Sun', 0]];
    const drawDays = () => {
      dbox.textContent = '';
      for (const [n, b] of DAYS) dbox.append(el('button', {class: days & (1 << b) ? 'on' : '', 'aria-pressed': days & (1 << b) ? 'true' : 'false',
        onclick: () => { days ^= 1 << b; drawDays(); }}, n));
      dbox.append(el('button', {onclick: () => { days = 127; drawDays(); }}, 'Every day'), el('button', {onclick: () => { days = 0x3E; drawDays(); }}, 'Weekdays'));
    };
    drawDays();
    box.append(el('h3', {}, 'Days'), dbox);
    const quiet = el('input', {type: 'checkbox', checked: !!p.quiet, style: 'min-height:0'});
    box.append(el('label', {style: 'display:flex;gap:10px;align-items:center;margin:14px 6px 4px;font-size:14px'}, quiet, 'Only tell me when there’s news'));
    if (p.events || p.wake) box.append(el('p', {style: 'margin-top:6px'}, (p.events ? 'It also starts on events. ' : '') + (p.wake ? 'It wakes the phone. ' : '') + 'Those stay as set in the app.'));
    const said = el('p', {style: 'color:var(--err);margin-top:6px', role: 'alert'});
    box.append(said, el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:6px'}, el('button', {class: 'btn', onclick: close}, 'Cancel'),
      el('button', {class: 'btn primary', onclick: async () => {
        const target = chat || (pick && pick.value);
        if (!target) { said.textContent = 'Pick a chat.'; return; }
        try {
          const r = await api('/web/schedule', {chat: target, text: msg.value, minutes: times, days, quiet: quiet.checked});
          if (r.error) { said.textContent = r.error; return; }
          close(); say(''); if (view === 'plans') loadView();
        } catch (e) { said.textContent = e.message; }
      }}, plan ? 'Save' : 'Create')));
    setTimeout(() => msg.focus(), 0);
  });
}

async function planOp(chat, op) {
  try { const r = await api('/web/plan', {chat, op}); say(r.error || ''); } catch (e) { say(e.message); }
  loadView();
}

/** A routine runs on the phone, with its cards and checks as always; its blanks are asked here first. */
function runRoutine(r) {
  const go = async values => {
    try { const x = await api('/web/routine', {name: r.name, values}); say(x.error || ''); } catch (e) { say(e.message); }
  };
  if (!r.blanks.length) { go({}); return; }
  sheet((box, close) => {
    const fields = r.blanks.map(b => [b, el('input', {placeholder: b, 'aria-label': b})]);
    box.append(el('h2', {}, r.name));
    for (const [b, f] of fields) box.append(el('h3', {}, b), el('div', {class: 'line'}, f));
    box.append(el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:10px'}, el('button', {class: 'btn', onclick: close}, 'Cancel'),
      el('button', {class: 'btn primary', onclick: () => { const v = {}; for (const [b, f] of fields) v[b] = f.value; close(); go(v); }}, 'Run')));
    setTimeout(() => fields[0][1].focus(), 0);
  });
}


if (key) start(); else pairScreen();
</script>
