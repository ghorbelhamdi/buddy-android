<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Buddy</title>
<style>
:root{--bg:#121110;--side:#171614;--card:#1D1B19;--card2:#262320;--line:#2A2724;--text:#F3EFE8;--muted:#A39D93;--soft:#C9C3B9;
  --accent:#4F8BFF;--accent-text:#8FB4FF;--bubble:#22314F;--bubble-text:#EEF3FF;--err:#F0A090;--err-bg:#3A2220;--ok:#5CC08A;--shadow:0 8px 28px rgba(0,0,0,.45)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FAF8F4;--side:#F3EFE8;--card:#FFFFFF;--card2:#F1EDE6;--line:#E3DDD3;--text:#1B1916;--muted:#6B655C;--soft:#4A453E;
  --accent:#2F6FE4;--accent-text:#1F56C0;--bubble:#DDE8FF;--bubble-text:#14233F;--err:#B3261E;--err-bg:#FBE4E1;--ok:#1E8A52;--shadow:0 8px 28px rgba(60,50,30,.16)}}
:root[data-theme="light"]{--bg:#FAF8F4;--side:#F3EFE8;--card:#FFFFFF;--card2:#F1EDE6;--line:#E3DDD3;--text:#1B1916;--muted:#6B655C;--soft:#4A453E;
  --accent:#2F6FE4;--accent-text:#1F56C0;--bubble:#DDE8FF;--bubble-text:#14233F;--err:#B3261E;--err-bg:#FBE4E1;--ok:#1E8A52;--shadow:0 8px 28px rgba(60,50,30,.16)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.btn{border-radius:12px;min-height:40px;padding:0 16px;background:var(--card2);font-weight:600}
.btn:hover{filter:brightness(1.12)}
.btn.small{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px;flex:none}
.btn.primary{background:var(--accent);color:#fff}
.grow{flex:1}
.btn.deny{background:var(--err-bg);color:var(--err)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

/* ---------- the two panes: each scrolls by itself, the page never does */
.shell{display:flex;height:100vh;height:100dvh}
aside{flex:0 0 320px;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px 20px}
.brand b{font-size:19px;letter-spacing:-.2px}
.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0}
.status span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:8px;height:8px;border-radius:4px;background:var(--ok)}
.dot.off{background:var(--err)}
.theme{flex:none;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-inline-start:auto}
.theme:hover{background:var(--card2);color:var(--text)}
.new{margin:4px 12px 8px;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--card2);font-weight:600;text-align:start}
.new:hover{filter:brightness(1.12)}
nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 8px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
nav h2{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 12px 6px;font-weight:600}
nav a{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;color:var(--text);text-decoration:none}
nav a:hover{background:var(--card)}
nav a.on,nav a.on:hover{background:none}
nav a .b{flex:1;min-width:0}
nav a .t,nav a .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a .t{font-weight:600}
nav a .s{font-size:13px;color:var(--muted)}
nav a .w{flex:none;font-size:12px;color:var(--muted);padding-top:2px}
nav a.wait .s{color:var(--accent-text)}
.pulse{flex:none;width:8px;height:8px;border-radius:4px;background:var(--accent);margin-top:7px;animation:pulse 1.4s ease-in-out infinite}
.pulse.ask{animation:none}
@keyframes pulse{50%{opacity:.25}}

.chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.head{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 20px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{flex:none;font-size:12px;font-weight:600;color:var(--soft);background:var(--card2);border-radius:999px;padding:3px 10px}
.back{display:none;flex:none;width:40px;height:40px;border-radius:20px;align-items:center;justify-content:center;margin-inline-start:-8px}
.back:hover{background:var(--card)}
#pane{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#pane:focus{outline:none}
.col{width:100%;max-width:800px;margin:0 auto;padding:0 20px}
#col{display:flex;flex-direction:column;gap:14px;min-height:100%;padding-top:20px;padding-bottom:24px;overflow-wrap:anywhere}
.dock{padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#cards{display:flex;flex-direction:column;gap:10px}
#cards:empty{display:none}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:100px;display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:20px;
  background:var(--card2);border:1px solid var(--line);box-shadow:var(--shadow)}
.jump:hover{filter:brightness(1.15)}
.jump svg{transform:rotate(180deg)}
.jump.show{display:flex}

/* ---------- messages */
.mine .user{align-self:flex-end}
.mine.editing .user{width:min(78%,620px);box-sizing:border-box;outline:2px solid var(--accent);outline-offset:2px}
.mine.editing textarea{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;color:inherit;font:inherit;line-height:inherit;resize:none;padding:0;outline:none;overflow-y:auto}
.mine.editing .edhint{align-self:flex-end;font-size:12px;color:var(--muted);max-width:min(78%,620px);text-align:end}
.mine.editing .edbtns{display:flex;align-self:flex-end;gap:8px}
.user{align-self:flex-end;max-width:min(78%,620px);background:var(--bubble);color:var(--bubble-text);border-radius:20px 20px 6px 20px;padding:10px 16px;white-space:pre-wrap}
.user .lab{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.user.fold .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{display:block;margin-top:4px;font-size:13px;font-weight:600;color:var(--accent-text);padding:0}
.acts{display:flex;gap:2px;margin-top:-8px}
.acts.own{align-self:flex-end;opacity:0;transition:opacity .12s}
.mine{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.mine:hover .acts.own,.mine:focus-within .acts.own{opacity:1}
@media (hover:none){.acts.own{opacity:1}}
.find{display:flex;gap:6px;padding:0 12px 6px}
.find input{flex:1;min-width:0;min-height:38px;border-radius:12px;font-size:14px}
.filters{display:flex;gap:6px;padding:0 12px 6px;flex-wrap:wrap}
.filters button{min-height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line)}
.filters button.on{color:var(--text);background:var(--card2);border-color:transparent}
.item{display:flex;align-items:center;border-radius:12px}
.item:hover{background:var(--card)}
.item.on,.item.on:hover{background:var(--line)}
.item a{flex:1;min-width:0}
.item a:hover,.item a.on{background:none}
.item .menu{flex:none;width:32px;height:36px;border-radius:10px;color:var(--muted);opacity:0;font-size:18px;line-height:1}
.item:hover .menu,.item .menu:focus-visible{opacity:1}
@media (hover:none){.item .menu{opacity:1}}
.item .menu:hover{background:var(--card2);color:var(--text)}
.unread .t::after{content:"";display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--accent);margin-inline-start:6px;vertical-align:middle}
.sheet textarea{min-height:120px;max-height:50vh;height:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);overflow-y:auto;margin:0 6px}
.acts button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.acts button:hover{background:var(--card);color:var(--text)}
.user .q,.quote{border-inline-start:3px solid var(--accent);padding:2px 0 2px 10px;color:var(--soft);font-size:14px;white-space:pre-wrap}
.user .q{margin-bottom:6px;opacity:.85;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.quotebox{display:flex;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 12px}
.quotebox .quote{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quotebox button{flex:none;width:30px;height:30px;border-radius:15px;color:var(--muted)}
.quotebox button:hover{background:var(--card2);color:var(--text)}
.model{flex:none;max-width:42%;height:40px;padding:0 10px;border-radius:12px;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--soft)}
.model:hover{background:var(--card2)}
.model span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.chip{cursor:pointer;display:flex;align-items:center;gap:4px}
button.chip.tog{color:var(--muted)}
button.chip.tog.on{color:var(--accent-text);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.setup{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.setup button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.setup button:hover{background:var(--card2)}
.setup button small{font-size:12px;color:var(--muted);display:block;text-align:start;line-height:1.2}
.setup button b{font-weight:600;display:block;text-align:start;line-height:1.3}
.setup .sw{flex:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative}
.setup .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:var(--muted)}
.setup .on .sw{background:var(--accent)}
.setup .on .sw::after{left:16px;background:#fff}
button.chip:hover{filter:brightness(1.15)}
.pop{position:fixed;z-index:20;min-width:170px;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.pop button{min-height:38px;padding:0 12px;border-radius:9px;text-align:start;font-size:14px}
.pop button:hover,.pop button:focus-visible{background:var(--card2);outline:none}
.pop .danger{color:var(--err)}
.icon{font-size:20px;line-height:1;flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.icon:hover{background:var(--card2);color:var(--text)}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);padding:0;width:min(440px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 48px));box-shadow:var(--shadow);overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{display:flex;flex-direction:column;gap:4px;padding:18px 14px 14px;overflow-y:auto;max-height:min(640px,calc(100vh - 48px));box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sheet h2{margin:2px 6px 10px;font-size:18px}
.sheet h3{margin:18px 6px 6px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet h2+h3,.sheet p+h3,.sheet .filter+h3{border-top:0;padding-top:0;margin-top:8px}
.sheet p{margin:-4px 6px 10px;font-size:13px;color:var(--muted)}
.sheet .filter{margin:0 6px 8px;min-height:40px}
.opt{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 10px;border-radius:12px;text-align:start;width:100%}
.opt:hover{background:var(--card2)}
.opt .n{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .c{flex:none;color:var(--accent-text);visibility:hidden}
.opt.on .c{visibility:visible}
.sheet .line{display:flex;gap:8px;padding:0 6px}
.sheet .line input{flex:1;min-width:0}
.places{display:flex;flex-direction:column;gap:2px;padding:0 8px 6px}
.places button{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;border-radius:12px;font-size:14px;color:var(--soft);text-align:start}
.places button:hover{background:var(--card);color:var(--text)}
.places button.on{background:var(--line);color:var(--text)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:14px;color:var(--muted);min-width:0}
.crumbs button{padding:4px 6px;border-radius:8px;color:var(--soft)}
.crumbs button:hover{background:var(--card);color:var(--text)}
.crumbs button:last-child{color:var(--text);font-weight:600}
.files{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.frow{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 8px 6px 14px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow:hover{background:var(--card2)}
.frow .nm{flex:1;min-width:0;text-align:start;display:flex;align-items:center;gap:12px;padding:4px 0}
.frow .nm>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .nm small{display:block;color:var(--muted);font-size:12px}
.frow .tile{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--soft)}
.frow .tile.dir{color:var(--accent-text);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.frow .ops{display:flex;gap:2px;opacity:0}
.frow:hover .ops,.frow:focus-within .ops{opacity:1}
@media (hover:none){.frow .ops{opacity:1}}
.frow .ops button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.frow .ops button:hover{background:var(--line);color:var(--text)}
.ups{display:flex;flex-direction:column;gap:6px}
.up{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.up .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up progress{width:120px;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.shot{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:start;min-width:0}
.shot:hover{border-color:var(--accent)}
.shot .pic{aspect-ratio:9/19;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px;text-align:center;padding:0 8px}
.shot .pic img{width:100%;height:100%;object-fit:contain;display:block}
.shot b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot small{color:var(--muted);font-size:12px;margin-top:-6px}
.big{display:flex;justify-content:center}
.big .pic{height:min(76vh,900px);max-width:100%;aspect-ratio:9/19;border-radius:18px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);text-align:center;padding:16px}
.big img{width:100%;height:100%;object-fit:contain}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pcard .t{font-weight:600}
.pcard .x{color:var(--soft);font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .w{color:var(--muted);font-size:13px}
.tag{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
h2.sec{margin:8px 0 0;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.clip{flex:none;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-inline-start:-12px}
.clip:hover{background:var(--card2);color:var(--text)}
.atts{display:flex;flex-wrap:wrap;gap:6px}
.atts:empty{display:none}
.att{display:flex;align-items:center;gap:6px;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px;font-size:13px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att.err{border-color:var(--err);color:var(--err)}
.att progress{width:60px;accent-color:var(--accent)}
.att button{flex:none;width:24px;height:24px;border-radius:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.mfiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.user .mfiles{justify-content:flex-end}
.mfiles img{max-width:280px;max-height:240px;border-radius:12px;display:block;cursor:zoom-in;background:var(--card)}
.user.bare{background:none;padding:0;border-radius:0}
.days{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
.days button{min-width:44px;min-height:36px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.times{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px;align-items:center}
.times span{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 2px 2px 8px}
.times input{min-height:34px;border:0;background:none;padding:0}
.times span button{width:28px;height:28px;border-radius:14px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sheet textarea.big{width:auto;resize:vertical;font:inherit;color:var(--text)}
.sheet select{font:inherit;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 10px;margin:0 6px}
.lightbox{width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
.lightbox .sheet{max-height:calc(100vh - 32px);align-items:center}
.lightbox img{max-width:100%;max-height:calc(100vh - 140px);border-radius:12px;display:block;object-fit:contain}
.mfiles .fchip{display:flex;align-items:center;gap:6px;max-width:240px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--text)}
.mfiles .fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrpanel{position:absolute;top:68px;right:16px;width:156px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.scrpanel .pic{aspect-ratio:9/19;border-radius:11px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:0 6px;cursor:zoom-in}
.scrpanel .pic img{width:100%;height:100%;object-fit:contain;display:block}
.scrpanel .pb{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:0 2px}
.scrpanel .pb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrpanel .pb button{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.scrpanel .pb button:hover{background:var(--card2);color:var(--text)}
@media (max-width: 820px){.scrpanel{width:104px;top:64px;right:10px}}
.chat.withpanel #col,.chat.withpanel .dock{padding-right:186px}
@media (max-width: 820px){.chat.withpanel #col,.chat.withpanel .dock{padding-right:124px}}
.shot .hb{display:flex;gap:6px}
.shot .hb button{min-height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--card2)}
.shot .hb button:hover{filter:brightness(1.12)}

async function api(path, body) {
  const r = await fetch(path, {method: body ? 'POST' : 'GET', headers: Object.assign({'Content-Type': 'application/json'},
    key ? {'Authorization': 'Bearer ' + key} : {}), body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { forget(); throw new Error('This device was removed on the phone.'); }
  return r.json();
}

function forget() { key = null; try { localStorage.removeItem('buddy-key'); } catch (e) {} pairScreen(); }

function deviceName() {
  const u = navigator.userAgent;
  const b = /Edg\//.test(u) ? 'Edge' : /Firefox\//.test(u) ? 'Firefox' : /Chrome\//.test(u) ? 'Chrome' : /Safari\//.test(u) ? 'Safari' : 'Browser';
  const o = /iPhone|iPad/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac OS/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : 'a computer';
  return b + ' on ' + o;
}

function pairScreen(msg) {
  app.textContent = '';
  const name = el('input', {id: 'name', value: deviceName(), maxlength: '40'});
  const box = el('div', {class: 'pair'},
    el('h1', {}, 'Buddy'),
    el('p', {class: 'muted'}, 'Pair this device to see your chats and answer approval cards. You approve it on the phone.'),
    el('label', {for: 'name'}, 'This device'), name,
    msg ? el('p', {class: 'said'}, msg) : null);
  const go = el('button', {class: 'btn primary', onclick: async () => {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    go.disabled = true;
    box.append(el('p', {}, 'Approve it on the phone. The card shows this code:'), el('div', {class: 'code'}, code.slice(0, 3) + ' ' + code.slice(3)));
    try {
      const r = await api('/web/pair', {name: name.value, code});
      if (r.key) { key = r.key; try { localStorage.setItem('buddy-key', key); } catch (e) {} start(); }
      else pairScreen('Not paired. Check that Other devices is on in Buddy, then try again.');
    } catch (e) { pairScreen('Not paired: ' + e.message); }
  }}, 'Pair');
  box.append(go);
  app.append(box);
}

/** Light or dark: as the device says until the button picks one (kept in this browser); next: the button was pressed. */
function theme(next) {
  let t = null;
  try { t = localStorage.getItem('buddy-theme'); } catch (e) {}
  if (next) {
    const dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    t = dark ? 'light' : 'dark';
    try { localStorage.setItem('buddy-theme', t); } catch (e) {}
  }
  if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); document.documentElement.style.colorScheme = t; }
  const dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches, b = $('theme');
  if (!b) return;
  b.textContent = '';
  b.append(icon(dark ? I.sun : I.moon, 18));
  b.setAttribute('aria-label', dark ? 'Light mode' : 'Dark mode');
  b.title = dark ? 'Light mode' : 'Dark mode';
}

function grow(ta) { ta.style.height = '40px'; ta.style.height = Math.min(200, ta.scrollHeight) + 'px'; ta.style.overflowY = ta.scrollHeight > 200 ? 'auto' : 'hidden'; }
function atEnd() { const p = $('pane'); return p.scrollHeight - p.scrollTop - p.clientHeight < 80; }
function end() { const p = $('pane'); p.scrollTop = p.scrollHeight; }
/** The arrow to the end: there while the end is most of a screen away or more (a long chat is a long way to scroll). */
function jump() { const p = $('pane'); $('jump').classList.toggle('show', p.scrollHeight - p.scrollTop - p.clientHeight > p.clientHeight * 0.75); }
function say(msg) { const s = $('said'); s.hidden = !msg; s.textContent = msg || ''; }

/** Another chat (null: a new one): it opens at its newest message. */
async function show(id) {
  leaveView();
  open = id; chatData = null; shown = PAGE; drawn = ''; toBottom = true; unfolded.clear(); say('');
  runOpen = false; runData = null; drawRun(); setQuote(null); clearAtts();
  if (!id) newDraft();
  $('shell').classList.remove('list');
  render();
  if (id) {
    try { const d = await api('/web/chat?id=' + encodeURIComponent(id)); if (open === id) chatData = d; } catch (e) { say(e.message); }
    render();
    markRead(id);
  }
  if (window.matchMedia('(min-width: 821px)').matches) $('msg').focus();
}

async function poll() {
  polling = true;
  for (;;) {
    try {
      const s = await api('/web/state?v=' + v);
      if (s.error) throw new Error(s.error);
      v = s.v; state = s; online = true;
      if (open) { const id = open, d = await api('/web/chat?id=' + encodeURIComponent(id)); if (open === id) chatData = d; }
      render();
      if (open && !document.hidden) markRead(open); // (a reply that came while it's open here is read)
    } catch (e) {
      if (!key) { polling = false; return; }
      online = false;
      render();
      await new Promise(r => setTimeout(r, 4000));
    }
  }
}

// ------------------------------------------------------------ what the phone says, drawn

function when(t) {
  const d = Date.now() - t, day = 86400000;
  if (d < 60000) return 'now';
  if (d < 3600000) return Math.floor(d / 60000) + ' min';
  if (d < day) return Math.floor(d / 3600000) + ' h';
  const x = new Date(t);
  return d < 6 * day ? x.toLocaleDateString(undefined, {weekday: 'short'}) : x.toLocaleDateString(undefined, {day: 'numeric', month: 'short'});
}

/** A reply's first line as plain words (the list has no room for its marks). */
function plain(s) { return (s || '').replace(/\*\*|__|`|^#+\s+|^[-*]\s+/g, '').trim(); }

function render() {
  if (!$('nav')) return;
  $('status').textContent = online ? 'Your phone' : 'Phone not reachable, trying again…';
  $('dot').classList.toggle('off', !online);
  if (state) drawList();
  $('shell').classList.toggle('view', !!view);
  for (const v of ['files', 'screens', 'plans', 'devices']) $('go-' + v).classList.toggle('on', view === v);
  if (view) drawView(); else drawChat();
  drawCards();
}

/** The chat is read here: the phone's unread mark goes, as when it's opened in the app. */
function markRead(id) {
  const c = state && state.chats.find(x => x.id === id);
  if (c && c.unread) { c.unread = false; api('/web/set', {chat: id, unread: false}).catch(() => {}); drawList(); }
}

// the list's search words and its filter: all (not the archived), pinned, unread or archived
let query = '', filter = 'all';

function drawList() {
  if (document.querySelector('.pop')) return; // (a menu is open on one of its rows: the list waits for it)
  const nav = $('nav'), top = nav.scrollTop, fb = $('filters');
  nav.textContent = ''; fb.textContent = '';
  const count = f => state.chats.filter(f).length;
  for (const [id, name, n] of [['all', 'All', 0], ['unread', 'Unread', count(c => c.unread && !c.archived)], ['pinned', 'Pinned', count(c => c.pinned)],
      ['archived', 'Archived', count(c => c.archived)]]) {
    if (id !== 'all' && !n && filter !== id) continue; // (a filter with nothing in it isn't offered)
    fb.append(el('button', {class: filter === id ? 'on' : '', 'aria-pressed': filter === id ? 'true' : 'false',
      onclick: () => { filter = id; drawList(); }}, name + (n ? ' ' + n : '')));
  }
  let chats = state.chats.slice().sort((a, b) => b.updated - a.updated).filter(c => filter === 'archived' ? c.archived : !c.archived);
  if (filter === 'pinned') chats = chats.filter(c => c.pinned);
  if (filter === 'unread') chats = chats.filter(c => c.unread);
  if (query) chats = chats.filter(c => ((c.title || '') + ' ' + (c.preview || '') + ' ' + (AGENTS[c.agent] || c.agent)).toLowerCase().includes(query));
  const groups = filter === 'all' && !query ? [['Waiting for you', c => c.waiting], ['Working', c => c.running && !c.waiting],
    ['Pinned', c => c.pinned && !c.running && !c.waiting], ['Recent', c => !c.pinned && !c.running && !c.waiting]]
    : [[query ? 'Found' : filter === 'archived' ? 'Archived' : filter === 'pinned' ? 'Pinned' : 'Unread', () => true]];
  for (const [title, f] of groups) {
    const list = chats.filter(f);
    if (!list.length) continue;
    nav.append(el('h2', {}, title));
    for (const c of list.slice(0, 80)) {
      const agent = AGENTS[c.agent] || c.agent;
      nav.append(el('div', {class: 'item' + (c.id === open ? ' on' : '') + (c.unread && c.id !== open ? ' unread' : '')},
        el('a', {href: '#', class: c.waiting ? 'wait' : '', 'aria-current': c.id === open ? 'page' : null, onclick: e => { e.preventDefault(); show(c.id); }},
          c.waiting ? el('span', {class: 'pulse ask'}) : c.running ? el('span', {class: 'pulse'}) : null,
          el('span', {class: 'b'}, el('span', {class: 't'}, c.title || 'Chat'),
            el('span', {class: 's'}, c.waiting ? 'Waiting for you · ' + agent : c.running ? 'Working · ' + agent : plain(c.preview) || agent)),
          c.running || c.waiting ? null : el('span', {class: 'w'}, when(c.updated))),
        el('button', {class: 'menu', 'aria-label': 'Menu for ' + (c.title || 'this chat'), 'aria-haspopup': 'menu', onclick: e => chatMenu(c.id, e.currentTarget)}, '⋯')));
    }
  }
  if (!chats.length) nav.append(el('p', {class: 'muted', style: 'padding:12px'}, query ? 'No chat matches.' : filter === 'all' ? 'No chats yet.' : 'Nothing here.'));
  nav.scrollTop = top;
}

/** The chat's messages as rows: a run of steps is one row, folded. */
function rows(d) {
  const out = [];
  d.messages.forEach((m, i) => {
    const at = (d.first || 0) + i, last = out[out.length - 1];
    if (m.k === 'step') { if (last && last.k === 'steps') last.steps.push(m.t); else out.push({k: 'steps', at, steps: [m.t]}); }
    else out.push({k: m.k, at, t: m.t, s: m.s, f: m.f, lx: m.lx, to: m.to, ne: m.ne, fn: m.fn, fo: m.fo, c: m.c, q: m.q, qf: m.qf, dr: m.dr});
  });
  return out;
}

function drawChat() {
  const col = $('col'), pane = $('pane'), d = open && chatData && !chatData.error ? chatData : null;
  $('title').textContent = d ? d.title || 'Chat' : open ? '' : 'New chat';
  $('agent').hidden = !d;
  if (d) { $('agent').textContent = ''; $('agent').append(AGENTS[d.agent] || d.agent, icon(I.chev, 14)); }
  $('optbtn').hidden = !d;
  $('scrchip').hidden = !d || !d.screen;
  if (d) $('scrchip').classList.toggle('on', !!d.screen && !panelHidden(open));
  drawPanel(d);
  $('devchip').hidden = !d || !d.linux;
  $('bgchip').hidden = !d || !d.canBackground;
  if (d && d.memberOf) { // a team's member's own chat: its settings are the team's (tell the leader), as on the phone
    $('agent').hidden = $('optbtn').hidden = $('devchip').hidden = $('bgchip').hidden = true;
  }
  if (d) {
    $('devchip').classList.toggle('on', !!d.dev);
    $('devchip').title = d.dev ? 'Linux tools are on in this chat: the agent may run commands and edit files. Click to turn them off.' : 'Linux tools are off in this chat. Click to turn them on from the next message.';
    $('devchip').setAttribute('aria-pressed', d.dev ? 'true' : 'false');
    $('bgchip').classList.toggle('on', !!d.background);
    $('bgchip').title = d.background ? 'Background mode is on: the agent works on a hidden screen. Click to turn it off.' : 'Background mode is off: the agent works on the phone’s own screen. Click to turn it on.';
    $('bgchip').setAttribute('aria-pressed', d.background ? 'true' : 'false');
  }
  $('model').hidden = !d || !d.model || !!d.memberOf; // (a member's model is the team's: tell the leader)
  if (d && d.model) { $('model').textContent = ''; $('model').append(el('span', {}, d.model), icon(I.chev, 14)); }
  $('msg').placeholder = open ? 'Message this chat' : 'Ask Buddy something';
  document.title = d && d.title ? d.title + ' · Buddy' : 'Buddy';
  // (a team's members can work while the chat's own agent doesn't: the line and Stop are theirs then)
  const working = !!(d && (d.running || d.busy));
  $('work').hidden = $('stopbtn').hidden = !working;
  $('runbtn').hidden = !(d && d.running);
  $('worktext').textContent = working ? (d.running ? d.status || 'Working' : d.busy) : '';
  drawTeam(d);
  const now = JSON.stringify([open, chatData, shown, [...unfolded], open ? null : draft, editing && [editing.chat, editing.at]]);
  if (now === drawn) return; // nothing new: what is unfolded or selected stays as it is
  drawn = now;
  const stick = toBottom || atEnd(), top = pane.scrollTop;
  col.textContent = '';
  if (!d) {
    col.append(open ? el('div', {class: 'working', style: 'margin:auto'}, chatData && chatData.error ? null : el('span', {class: 'spin'}),
        chatData && chatData.error ? 'This chat isn’t on the phone any more.' : 'Opening…')
      : el('div', {class: 'empty'}, el('h2', {}, 'What should Buddy do?'),
          el('p', {class: 'muted'}, draft ? 'Set up the new chat, then write your message below.' : 'A new chat starts with the agent your phone uses for new chats.'),
          draft ? setup() : null));
    jump();
    return;
  }
  if (d.memberOf) col.append(el('button', {class: 'btn memberof', onclick: () => show(d.memberOf.id)}, icon(I.back, 16),
    'Team member in “' + d.memberOf.title + '”'));
  const all = rows(d), from = Math.max(0, all.length - shown);
  if (from > 0) col.append(el('button', {class: 'btn earlier', onclick: () => { keep = pane.scrollHeight - pane.scrollTop; shown += PAGE; drawChat(); }}, 'Show earlier messages'));
  else if (d.first > 0) col.append(el('div', {class: 'note', style: 'align-self:center'}, 'Earlier messages are on the phone.'));
  // member answers that came one after another fold into one card (not errors, files or answers to you directly)
  const foldable = r => r && r.k === 'buddy' && r.fn && r.c && !r.dr && !r.f && !r.lx && !d.memberOf;
  for (let i = from; i < all.length; i++) {
    let j = i;
    while (j < all.length && foldable(all[j])) j++;
    if (j - i >= 2 && !unfolded.has('r' + all[i].at)) { col.append(roundCard(all.slice(i, j), 'r' + all[i].at)); i = j - 1; continue; }
    col.append(row(all[i], d.running && i === all.length - 1));
  }
  if (d.running && (!all.length || all[all.length - 1].k !== 'steps')) col.append(el('div', {class: 'working'}, el('span', {class: 'spin'}), 'Working…'));
  if (keep != null) { pane.scrollTop = pane.scrollHeight - keep; keep = null; } // (earlier messages came in above: the view stays where it was)
  else if (stick) { end(); toBottom = false; }
  else pane.scrollTop = top;
  jump();
}

/** A round of member answers as one card: their marks, how many, each one's first lines, and Show all. */
function roundCard(rs, key) {
  const names = [...new Set(rs.map(r => r.fn))].slice(0, 4);
  return el('div', {class: 'round'},
    el('div', {class: 'rh'}, el('span', {class: 'avs'}, ...names.map(n => avatar(n, rs.find(r => r.fn === n).c))),
      el('b', {}, 'Team round · ' + rs.length + ' answers'),
      el('button', {class: 'btn small', onclick: () => { unfolded.add(key); drawChat(); }}, 'Show all')),
    ...rs.map(r => tint(el('p', {}, el('b', {}, r.fn), ' ', plain(r.t)), r.c)));
}

/** The open chat is a team's member's own (its settings, edit and fork are the team's chat's business). */
function inMember() { return !!(chatData && chatData.memberOf); }

/** A member's (or the leader's) colours on an element: its dot, name and frame take them. */
function tint(node, c) {
  node.classList.add('tm');
  if (c) { node.style.setProperty('--md', c[0]); node.style.setProperty('--ml', c[1]); } else node.classList.add('lead');
  return node;
}

/** Who the next message goes to in a chat with a team: "leader" and members' ids (the leader alone unless more are ticked). */
let sendTo = new Set(['leader']), sendToChat = null, teamDrawn = '';

/** A chat with a team: its members over the chat, each with its state, and the boxes over the message box. */
function drawTeam(d) {
  drawTeamWait(d);
  const t = d && d.team && !d.team.off ? d.team : null, strip = $('team'), boxes = $('tochip');
  strip.hidden = !t;
  boxes.hidden = !t || !!d.memberOf; // (in a member's own chat, a message goes to that member)
  if (!t) { teamDrawn = ''; return; }
  const L = t.leader || {agent: d.agent, running: d.running, chat: open};
  // (another chat, or other members: the boxes start over at the leader alone, so an old tick can't land on a new member)
  const teamKey = open + '|' + t.members.map(m => m.id + m.name).join(',');
  if (sendToChat !== teamKey) { sendToChat = teamKey; sendTo = new Set(['leader']); }
  const ids = new Set(['leader', ...t.members.map(m => m.id)]);
  for (const id of [...sendTo]) if (!ids.has(id)) sendTo.delete(id);
  if (!sendTo.size) sendTo.add('leader');
  const now = JSON.stringify([open, t, d.running, d.status, [...sendTo]]);
  if (now === teamDrawn) return;
  teamDrawn = now;
  strip.textContent = '';
  // one bar: the shape, then each one's mark and state in a word. A mark opens that one's own chat (the leader's:
  // back to the team's chat); the shape and the arrow, and the one whose chat this is, open the team panel
  const leadWord = L.running ? (L.waiting ? 'Waiting' : 'Working') : 'Ready';
  const panel = () => teamShape(!d.memberOf);
  const one = (name, c, word, on, chat, lead) => {
    const cur = chat === open, to = chat && !cur ? () => show(chat) : panel;
    return tint(el('button', {class: 'one' + (on ? ' on' : '') + (cur ? ' cur' : ''), onclick: to,
      title: chat && !cur ? (lead ? 'Back to the team’s chat' : 'Open ' + name + '’s chat') : 'The team',
      'aria-label': name + ' ' + word + (chat && !cur ? (lead ? ': back to the team’s chat' : ': open its chat') : ': the team')}, avatar(name, c), word), c);
  };
  strip.append(el('div', {class: 'tbar', role: 'group', 'aria-label': t.name + ' team'},
    el('button', {class: 'shp', 'aria-label': t.name + ': show the team', title: 'The team', onclick: panel}, shapePic(t.structure, 30)),
    one('Leader', null, leadWord, L.running, L.chat, true),
    ...t.members.map(m => one(m.name, m.c, m.state, m.running, m.chat, false)), el('span', {class: 'sp', onclick: panel}),
    el('button', {class: 'shp', 'aria-label': 'Show the team', title: 'The team', onclick: panel}, icon(I.chev, 16))));
  paintTo(t);
}

/** A member's mark: its initial on its colour. */
function avatar(name, c) {
  // its initial, with its number where its name ends in one ("Worker 2": W2), so Worker 1 to 4 aren't four times W
  const s = (name || '').trim(), first = ([...s][0] || '?').toUpperCase(), m = /(\d{1,2})$/.exec(s);
  const mark = !m || m.index === 0 ? first : m[1].length === 1 ? first + m[1] : m[1];
  return tint(el('span', {class: 'av', 'aria-hidden': 'true'}, mark.length > 1 ? el('span', {style: 'font-size:.84em'}, mark) : mark), c);
}

/** Who a team chat's message can go to: the leader first, then the members. */
function recipients(t) {
  return [{id: 'leader', name: 'Leader', c: null}, ...t.members];
}

/** The message box's To chip: the marks of whom the message goes to, a name or how many, and an arrow to pick. */
function paintTo(t) {
  const chip = $('tochip'), who = recipients(t).filter(m => sendTo.has(m.id));
  chip.textContent = '';
  chip.append(el('span', {class: 'avs'}, ...who.slice(0, 3).map(m => avatar(m.name, m.c))),
    who.length === 1 ? 'To ' + who[0].name : 'To ' + who.length, icon(I.chev, 14));
  chip.setAttribute('aria-label', 'Send to: ' + who.map(m => m.name).join(', ') + '. Change who gets it');
  chip.title = 'Who the message goes to';
}

/** The To chip's picker: the leader and each member with its agent and what it does now; a tick counts at once. */
function pickTo() {
  const d = chatData, t = d && d.team && !d.team.off ? d.team : null;
  if (!t) return;
  sheet((box, close) => {
    const draw = () => {
      box.textContent = '';
      box.append(el('h2', {}, 'Send to'));
      const L = t.leader || {agent: d.agent, running: d.running};
      for (const m of recipients(t)) {
        const lead = m.id === 'leader';
        const on = lead ? AGENTS[L.agent] || L.agent : m.on, state = lead ? (L.running ? 'Working' : 'Ready') : m.state;
        const cb = el('input', {type: 'checkbox', onchange: () => {
          if (!sendTo.delete(m.id)) sendTo.add(m.id);
          if (!sendTo.size) sendTo.add('leader');
          paintTo(t); draw();
        }});
        cb.checked = sendTo.has(m.id);
        box.append(tint(el('label', {class: 'torow' + (sendTo.has(m.id) ? ' on' : '')}, cb, avatar(m.name, m.c),
          el('span', {class: 't'}, el('b', {}, m.name), el('small', {}, on ? on + ' · ' + state : state))), m.c));
      }
      box.append(el('div', {class: 'line', style: 'margin-top:14px'},
        el('button', {class: 'btn', onclick: () => { recipients(t).forEach(m => sendTo.add(m.id)); paintTo(t); draw(); }}, 'Everyone'),
        el('button', {class: 'btn primary', onclick: close}, 'Done')));
    };
    draw();
  });
}

/** A structure's shape as a small picture: the leader and what links it in its colour, the members plain. */
function shapePic(structure, w) {
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 40 32'); svg.setAttribute('width', w); svg.setAttribute('height', w * 0.8);
  svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round'); svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'shapepic');
  const box = (x, y, bw, bh, a) => { const r = document.createElementNS(ns, 'rect'); r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', bw); r.setAttribute('height', bh); r.setAttribute('rx', 3); if (a) r.setAttribute('class', 'a'); svg.append(r); };
  const line = d => { const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); p.setAttribute('class', 'a'); svg.append(p); };
  if (structure === 'lead') { box(14, 2, 12, 8, true); line('M20 10v5M7 15h26M7 15v6M20 15v6M33 15v6'); box(2, 21, 10, 8); box(15, 21, 10, 8); box(28, 21, 10, 8); }
  else if (structure === 'check') { box(2, 11, 12, 10); box(26, 11, 12, 10); line('M16 14h8M21 11.5l3 2.5-3 2.5M24 18.5h-8M19 16l-3 2.5 3 2.5'); }
  else if (structure === 'doers') { box(2, 3, 16, 10); box(22, 3, 16, 10); line('M10 13v6h20v-6M20 19v4'); box(14, 23, 12, 7, true); }
  else { box(1, 12, 10, 8); box(15, 12, 10, 8); box(29, 12, 10, 8); line('M11 16h4M25 16h4'); }
  return svg;
}

/** The open chat's team drawn in its shape: the leader, the members where the structure puts them, and what was set. To look at. */
function teamShape(withOff) {
  const d = chatData, t = d && d.team;
  if (!t || t.off) return;
  sheet((box, close) => {
    box.classList.add('wide');
    box.append(el('h2', {style: 'display:flex;align-items:center;gap:10px'}, shapePic(t.structure, 40), t.name),
      el('p', {}, t.workspace + ' · ' + t.apps));
    const go = chat => () => { close(); show(chat); };
    // one's card: its mark and name in its colour, its agent, goal, last answer and state; a member with an app on
    // its hidden screen shows that screen (through /web/shot and its rules); a tap opens its own chat
    const card = (name, on, goal, last, state, running, c, lead, chat, screen) => {
      const here = chat === open, shot = screen ? el('span', {class: 'shot'}, 'Loading…') : null;
      if (shot) (async () => {
        try {
          const x = await fetch('/web/shot?id=' + encodeURIComponent(chat) + '&w=240', {headers: {Authorization: 'Bearer ' + key}});
          if (x.ok) { const u = URL.createObjectURL(await x.blob()); shot.textContent = ''; shot.append(el('img', {alt: name + '’s hidden screen', src: u, onload: () => URL.revokeObjectURL(u)})); }
          else { let why = 'Nothing to show yet.'; try { why = (await x.json()).error || why; } catch (e) {} shot.textContent = why; }
        } catch (e) { shot.textContent = ''; }
      })();
      return tint(el(chat ? 'button' : 'div', {class: 'tcard' + (lead ? ' lead' : '') + (here ? ' cur' : ''),
          title: chat && !here ? (lead ? 'Back to the team’s chat' : 'Open ' + name + '’s chat') : null,
          onclick: chat ? (here ? close : go(chat)) : null}, // (the one whose chat this is: the panel closes, back to it)
        el('span', {class: 'nm'}, avatar(name, c), el('b', {}, name), el('span', {class: 'sw' + (running ? ' on2' : '')}, state)),
        el('span', {class: 'on'}, on), goal ? el('span', {class: 'goal'}, goal) : null,
        last ? el('span', {class: 'last'}, 'Last: ' + last) : null, shot), c);
    };
    const arrow = s => el('span', {class: 'ar', 'aria-hidden': 'true'}, s);
    const shape = el('div', {class: 'tshape'});
    const L = t.leader || {agent: d.agent, model: d.model, running: d.running, chat: open};
    shape.append(card('Leader', (AGENTS[L.agent] || L.agent) + (L.model ? ' · ' + L.model : ''), 'this chat', '',
      L.running ? (L.waiting ? 'Waiting' : 'Working') : 'Ready', L.running, null, true, L.chat, false));
    const cards = t.members.map(m => card(m.name, m.on, m.goal, m.last, m.state, m.running, m.c, false, m.chat, m.screen));
    // down to the one under it; or, to members side by side, a line that parts to them (drawn: sideways arrows come out as emoji)
    if (cards.length && (t.structure === 'pipe' || t.structure === 'check' || cards.length === 1)) shape.append(arrow('↓'));
    else if (cards.length) {
      const ns = 'http://www.w3.org/2000/svg', fan = document.createElementNS(ns, 'svg'), path = document.createElementNS(ns, 'path');
      fan.setAttribute('viewBox', '0 0 100 20'); fan.setAttribute('preserveAspectRatio', 'none'); fan.setAttribute('class', 'fan'); fan.setAttribute('aria-hidden', 'true');
      path.setAttribute('d', 'M50 2V10M18 10H82M18 10V18M82 10V18' + (cards.length > 2 ? 'M50 10V18' : '')); path.setAttribute('vector-effect', 'non-scaling-stroke');
      fan.append(path); shape.append(fan);
    }
    if (t.structure === 'pipe') cards.forEach((c, i) => { if (i) shape.append(arrow('↓')); shape.append(c); }); // one after another
    else {
      const line = el('div', {class: 'rowm'});
      if (t.structure === 'check') { // a doer beside its checker, pair by pair
        for (let i = 0; i < cards.length; i += 2) line.append(el('div', {class: 'tpair'}, cards[i], cards[i + 1] ? arrow('⇄') : null, cards[i + 1] || null));
      } else line.append(...cards);
      shape.append(line);
    }
    box.append(shape);
    if (t.handoff || t.rules) box.append(el('div', {class: 'tfacts'},
      t.handoff ? el('span', {}, 'Hand-off: ' + t.handoff) : null, t.rules ? el('span', {}, 'Rules: ' + t.rules) : null));
    box.append(el('div', {class: 'line', style: 'align-items:center;margin-top:14px;gap:12px'},
      el('p', {style: 'margin:0 6px;flex:1'}, 'To change the team, tell the leader.'),
      withOff ? el('button', {class: 'btn deny', onclick: async () => {
        if (!confirm('Turn the team off? The members’ chats go, with what they remember. Files they made stay.')) return;
        try { const r = await api('/web/team', {action: 'off', chat: open}); if (r.error) { say(r.error); return; } close(); refreshChat(); } catch (e) { say(e.message); }
      }}, 'Turn off') : null));
  });
}

// ------------------------------------------------------------ a chat's team: set up here as on the phone

let teamWaitDrawn = '';

/** The setup the user asked for in the chat (the leader's team_start), waiting: a card that opens it here. */
function drawTeamWait(d) {
  const box = $('teamwait'), w = d && d.team && d.team.draft ? d.team.draft : null, now = JSON.stringify([open, w]);
  if (now === teamWaitDrawn) return;
  teamWaitDrawn = now;
  box.textContent = '';
  if (!w) return;
  const names = w.team.members.map(m => m.name).join(', ');
  box.append(el('div', {class: 'card'}, el('span', {class: 'lab'}, 'TEAM SETUP'),
    el('div', {class: 'row', style: 'align-items:center'},
      el('span', {style: 'flex:1 1 220px'}, 'The team you asked for is waiting to be set up' + (w.members ? ': ' + names + '.' : '.')),
      el('button', {class: 'btn', style: 'flex:none', onclick: async () => { try { await api('/web/team', {action: 'dismiss', chat: open}); refreshChat(); } catch (e) { say(e.message); } }}, 'Not now'),
      el('button', {class: 'btn primary', style: 'flex:none', onclick: () => teamSetup(w.team, w)}, 'Set it up'))));
}

async function refreshChat() {
  try { chatData = await api('/web/chat?id=' + encodeURIComponent(open)); drawn = ''; render(); } catch (e) { say(e.message); }
}

/** Chat menu → Team…: the team in its shape (with Turn off), or the setup (from the chat's last team, if it had one). */
function teamMenu() {
  const t = chatData && chatData.team;
  if (t && !t.off) { teamShape(true); return; }
  if (t && t.draft) { teamSetup(t.draft.team, t.draft); return; }
  teamSetup(t && t.last ? t.last : null, null);
}

const STRUCTS = [['lead', 'Leader + workers', 'The leader splits the task, each worker does a part, the leader checks and puts it together.'],
  ['pipe', 'Pipeline', 'One after another, for example plan, build, check. Each step gets the reports before it.'],
  ['check', 'Doer + checker', 'One does the work, another reviews it; back and forth until it passes.'],
  ['doers', 'Doers with their own goals', 'Several doers at the same time, each with its own goal; the leader puts it together.']];
const WORKSPACES = [['sep', 'Each in its own folder', 'Separate folders; the leader brings the results together.'],
  ['same', 'All in the chat’s folder', 'Everyone works on the same files.'],
  ['look', 'Only look things up', 'Members read and report; only the leader changes things.']];
const APPS = [['diff', 'Each on a different app', 'At the same time; the leader keeps two members out of one app.'],
  ['turn', 'One app at a time', 'Members can use the same app; the others wait until it’s free.'],
  ['none', 'No phone apps', 'Only the background browser and Linux tools.']];

/** A member's colours as the phone gives them (Team's palette: on dark, on light), by its colour index or its place. */
const TEAM_DARK = ['#6FA8FF', '#5CC08A', '#B48CFF', '#E8C15A', '#F08DB5', '#5FD0D0'], TEAM_LIGHT = ['#2563C9', '#1E7F4E', '#7445C7', '#8A6A00', '#B93A76', '#0F7C7C'];
function memberColor(m, i) {
  const k = ((Number.isInteger(m.color) ? m.color : i) % 6 + 6) % 6;
  return [TEAM_DARK[k], TEAM_LIGHT[k]];
}

/** The agents signed in on the phone, and each one's models, as the page's New chat screen gets them. */
const teamModels = {};
async function agentModels(agent) {
  if (teamModels[agent]) return teamModels[agent];
  try {
    const r = await api('/web/new?agent=' + encodeURIComponent(agent));
    if (!r.error) teamModels[agent] = r; // (an error isn't kept: asked again next time)
    return r;
  } catch (e) { say(e.message); return {models: []}; }
}

/**
 * The phone's team setup, here: how it works, where members work, how they share apps (each left out when the user
 * said it in the chat: draft), then the members with their agents and models. Start the team starts it.
 */
async function teamSetup(from, draft) {
  const chat = open;
  let pre;
  try { pre = await api('/web/team-preset?chat=' + encodeURIComponent(chat) + '&structure=' + encodeURIComponent((from && from.structure) || 'pipe')); }
  catch (e) { say(e.message); return; }
  if (pre.error) { say(pre.error); return; }
  const base = await agentModels('');
  const agents = (base.agents || []).map(a => ({id: a.id, name: a.name}));
  const t = JSON.parse(JSON.stringify(from || pre.team));
  const known = draft ? [draft.structure, draft.workspace, draft.apps] : [false, false, false];
  if (!pre.screens) t.apps = 'none';
  // everything on one sheet: the shape, the members in it with their agents, where they work and the apps; what
  // the user already said in the chat is filled in and marked so
  sheet((box, close) => {
    box.classList.add('wide');
    const sec = (name, from) => el('div', {class: 'tsec'}, name, from ? el('small', {}, 'From your message') : null);
    const seg = (list, cur, pick) => {
      const o = list.find(x => x[0] === cur);
      return [el('div', {class: 'tseg', role: 'radiogroup'}, ...list.map(x => el('button', {class: x[0] === cur ? 'on' : '', role: 'radio',
        'aria-checked': x[0] === cur ? 'true' : 'false', onclick: () => { pick(x[0]); draw(); }}, x[1]))), o ? el('p', {class: 'tinfo'}, o[2]) : null];
    };
    const draw = async () => {
      box.textContent = '';
      box.append(el('h2', {}, 'Set up a team'));
      box.append(sec('Shape', known[0]), el('div', {class: 'ttiles', role: 'radiogroup', 'aria-label': 'Shape'}, ...STRUCTS.map(o =>
        el('button', {class: 'ttile' + (o[0] === t.structure ? ' on' : ''), role: 'radio', 'aria-checked': o[0] === t.structure ? 'true' : 'false', onclick: async () => {
          if (o[0] === t.structure) return;
          if (draft && draft.members) { // (the members the user named stay; a hand-off the user didn't say follows the shape)
            if (!draft.handoff) { try { const p = await api('/web/team-preset?chat=' + encodeURIComponent(chat) + '&structure=' + o[0]); t.handoff = p.team.handoff; } catch (e) {} }
            t.structure = o[0]; draw(); return;
          }
          try { const p = await api('/web/team-preset?chat=' + encodeURIComponent(chat) + '&structure=' + o[0]);
            // (rules and a hand-off the user said stay)
            Object.assign(t, {structure: o[0], members: p.team.members, handoff: draft && draft.handoff ? t.handoff : p.team.handoff}); draw(); } catch (e) { say(e.message); }
        }}, shapePic(o[0], 40), o[1]))),
        el('p', {class: 'tinfo'}, (STRUCTS.find(x => x[0] === t.structure) || STRUCTS[1])[2]));
      box.append(sec('Members', draft && draft.members), el('p', {class: 'tinfo', style: 'margin-top:0'},
        'Pick each one’s agent and model. The leader is this chat’s agent (change it with the agent chip at the top).'));
      const shape = el('div', {class: 'tshape'});
      shape.append(tint(el('div', {class: 'tcard lead'}, el('span', {class: 'nm'}, avatar('Leader', null), el('b', {}, 'Leader')),
        el('span', {class: 'on'}, (AGENTS[chatData.agent] || chatData.agent) + (chatData.model ? ' · ' + chatData.model : '')), el('span', {class: 'goal'}, 'this chat')), null));
      const cards = [];
      for (const m of t.members) {
        const ms = await agentModels(m.agent);
        const name = el('input', {value: m.name, maxlength: '40', 'aria-label': 'Name', oninput: e => { m.name = e.target.value; }});
        const ag = el('select', {'aria-label': m.name + '’s agent', onchange: e => { m.agent = e.target.value; m.model = ''; draw(); }},
          ...agents.map(a => el('option', {value: a.id}, a.name)));
        ag.value = m.agent;
        const mo = el('select', {'aria-label': m.name + '’s model', onchange: e => { m.model = e.target.value; }},
          ...(ms.models || []).map(x => x.heading ? el('option', {disabled: true}, '— ' + x.heading + ' —') : el('option', {value: x.id}, x.name)));
        mo.value = m.model || '';
        const c = memberColor(m, t.members.indexOf(m));
        cards.push(tint(el('div', {class: 'tcard edit'},
          el('span', {class: 'nm'}, avatar(m.name, c), name,
            el('button', {class: 'x', 'aria-label': 'Remove ' + m.name, title: 'Remove', onclick: () => { t.members.splice(t.members.indexOf(m), 1); draw(); }}, icon(I.x, 14))),
          el('label', {}, el('small', {}, 'Agent'), ag), el('label', {}, el('small', {}, 'Model'), mo),
          m.goal ? el('span', {class: 'goal'}, m.goal) : null), c));
      }
      cards.push(el('button', {class: 'tcard addm', onclick: () => {
        const n = t.structure === 'pipe' ? 'Step ' : t.structure === 'lead' ? 'Worker ' : 'Doer ';
        let i = t.members.length + 1;
        while (t.members.some(m => m.name.toLowerCase() === (n + i).toLowerCase())) i++;
        t.members.push({name: n + i, agent: chatData.agent === 'claude-code' ? 'claude' : chatData.agent, model: '', goal: ''}); draw();
      }}, '+ Add a member'));
      shape.append(el('span', {class: 'ar', 'aria-hidden': 'true'}, '↓'));
      if (t.structure === 'pipe') cards.forEach((c, i) => { if (i) shape.append(el('span', {class: 'ar', 'aria-hidden': 'true'}, '↓')); shape.append(c); });
      else shape.append(el('div', {class: 'rowm'}, ...cards));
      box.append(shape);
      box.append(sec('Where do the members work?', known[1]), ...seg(WORKSPACES, t.workspace, k => { t.workspace = k; }));
      box.append(sec('How do they share the phone’s apps?', known[2]));
      if (pre.screens) box.append(...seg(APPS, t.apps, k => { t.apps = k; }));
      else box.append(el('p', {class: 'tinfo', style: 'margin-top:0'}, 'Background mode isn’t set up on the phone, so members have no phone screen: only the background browser and Linux tools.'));
      box.append(el('p', {style: 'margin:16px 6px 0'}, 'Goals, what happens when a step fails, and rules start with defaults. To change them, tell the leader.'));
      box.append(el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:14px'},
        el('button', {class: 'btn', onclick: close}, 'Cancel'),
        el('button', {class: 'btn primary', disabled: !t.members.length, onclick: async () => {
          try {
            const r = await api('/web/team', {action: 'start', chat, draft: !!draft,
              team: {structure: t.structure, workspace: t.workspace, apps: t.apps, handoff: t.handoff, rules: t.rules,
                members: t.members.map(m => ({name: m.name.trim(), agent: m.agent, model: m.model || '', goal: m.goal || ''}))}});
            if (r.error) { say(r.error); return; }
            close(); refreshChat();
          } catch (e) { say(e.message); }
        }}, 'Start the team')));
    };
    draw();
  });
}

/** What the leader or a member said, in a team's chat: under its name, in its colour, with the message it answers. */
function from(r, body) {
  return tint(el('div', {class: 'from'},
    el('div', {class: 'who'}, el('span', {class: 'dotc'}), el('b', {}, r.fn), el('small', {}, r.fo || '')),
    r.q ? el('div', {class: 'qt'}, el('b', {}, (r.qf || 'You') + ': '), r.q) : null, body), r.c);
}

/** One step: a long one (a script in a command) shows its first lines, and all of it on a click. */
function step(s) {
  if (s.length <= 280 && s.split('\n').length <= 4) return el('li', {}, el('span', {}, s));
  const b = el('button', {title: 'Show all of it', onclick: () => b.classList.toggle('all')}, el('span', {}, s));
  return el('li', {}, b);
}

function row(r, live) {
  if (r.k === 'steps') {
    const n = r.steps.length;
    const dt = el('details', {class: 'steps', open: unfolded.has(r.at)},
      el('summary', {}, live ? el('span', {class: 'spin'}) : el('span', {class: 'tick'}, icon(I.check, 18)),
        el('span', {class: 'n'}, live ? r.steps[n - 1] : n + (n === 1 ? ' tool call' : ' tool calls')), el('span', {class: 'v'})),
      el('ol', {}, ...r.steps.map(step)));
    // (the phone's next update draws the chat again: it must find this row as the user left it)
    dt.addEventListener('toggle', () => { if (dt.open) unfolded.add(r.at); else unfolded.delete(r.at); drawn = JSON.stringify([open, chatData, shown, [...unfolded], open ? null : draft, editing && [editing.chat, editing.at]]); });
    return dt;
  }
  if (r.k === 'user' && editing && editing.chat === open && editing.at === r.at) return editor(r);
  if (r.k === 'user') {
    // a schedule's message is its whole instruction: three lines of it, the rest on a tap
    const long = r.s && r.t.length > 220, key = 'u' + r.at, fold = long && !unfolded.has(key);
    const q = r.s ? null : splitQuote(r.t); // a message that quotes another: the quote in its own block
    const b = el('div', {class: 'user' + (fold ? ' fold' : '')}, r.s ? el('span', {class: 'lab'}, 'Scheduled') : null,
      q ? el('div', {class: 'q'}, q[0]) : null, el('span', {class: 'tx'}, q ? q[1] : r.t));
    if (long) b.append(el('button', {class: 'more', onclick: () => { if (unfolded.has(key)) unfolded.delete(key); else unfolded.add(key); keep = $('pane').scrollHeight - $('pane').scrollTop; drawChat(); }},
      fold ? 'Show all' : 'Show less'));
    if (!r.t) { b.querySelector('.tx').remove(); b.classList.add('bare'); } // (files alone: no bubble around them)
    const fs = msgFiles(r);
    if (fs) b.append(fs);
    // your own message, as in the app: copy, quote, edit (it is asked again from there) and fork
    const say1 = q ? q[1] : r.t;
    return el('div', {class: 'mine'}, r.to ? el('span', {class: 'to'}, '→ ' + r.to) : null, b, el('div', {class: 'acts own'},
      el('button', {'aria-label': 'Copy', title: 'Copy', onclick: e => copy(say1, e.currentTarget)}, icon(I.copy, 18)),
      el('button', {'aria-label': 'Quote', title: 'Quote in your next message', onclick: () => setQuote(r.t)}, icon(I.quote, 18)),
      r.s || r.ne || inMember() ? null : el('button', {'aria-label': 'Edit', title: 'Edit and ask again from here', onclick: () => edit(r.at, say1)}, icon(I.edit, 18)),
      inMember() ? null : el('button', {'aria-label': 'Fork from here', title: 'Fork: a new chat with the conversation up to here', onclick: () => fork(r.at)}, icon(I.fork, 18))));
  }
  if (r.k === 'buddy') {
    const b = el('div', {class: 'buddy'});
    markdown(b, r.t);
    const fs = msgFiles(r);
    if (fs) b.append(fs);
    const f = document.createDocumentFragment();
    f.append(r.fn ? from(r, b) : b, el('div', {class: 'acts'},
      el('button', {'aria-label': 'Copy', title: 'Copy', onclick: e => copy(r.t, e.currentTarget)}, icon(I.copy, 18)),
      el('button', {'aria-label': 'Quote', title: 'Quote in your next message', onclick: () => setQuote(r.t)}, icon(I.quote, 18)),
      inMember() ? null : el('button', {'aria-label': 'Fork from here', title: 'Fork: a new chat with the conversation up to here', onclick: () => fork(r.at)}, icon(I.fork, 18))));
    return f;
  }
  const line = el('div', {class: r.k === 'error' ? 'error' : 'note'}, r.t);
  return r.fn && r.k === 'error' ? from(r, line) : line; // (a member that failed: its own error, under its name)
}

// ------------------------------------------------------------ a reply's formatting (built as elements: never as HTML text)

function inline(into, s) {
  // (a link to a file in Buddy's Linux, [answers](/root/.buddy/work/…/answers.md): its text, opening Files where it is)
  const re = /(`[^`\n]+`)|(\*\*[^\n]+?\*\*)|(\[([^\]\n]+)\]\((https?:\/\/[^\s)]+|~?\/[^\s)]+)\))|(https?:\/\/[^\s<>()]*[^\s<>().,;:!?'"*])|(\*[^*\s](?:[^*\n]*[^*\s])?\*)/g;
  let at = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > at) into.append(s.slice(at, m.index));
    if (m[1]) into.append(el('code', {}, m[1].slice(1, -1)));
    else if (m[2]) { const b = el('strong'); inline(b, m[2].slice(2, -2)); into.append(b); }
    else if (m[3] && !/^https?:/.test(m[5])) { // in Buddy's Linux: Files at it (a file: at its folder, the phone says which)
      const p = m[5].startsWith('~/') ? '/root' + m[5].slice(1) : m[5], dir = p;
      into.append(el('a', {href: '#', title: p, onclick: e => { e.preventDefault(); openView('files'); setTimeout(() => goFiles(dir), 300); }}, m[4]));
    }
    else if (m[3]) into.append(el('a', {href: m[5], target: '_blank', rel: 'noopener noreferrer'}, m[4]));
    else if (m[6]) into.append(el('a', {href: m[6], target: '_blank', rel: 'noopener noreferrer'}, m[6]));
    else { const i = el('em'); inline(i, m[7].slice(1, -1)); into.append(i); }
    at = re.lastIndex;
  }
  if (at < s.length) into.append(s.slice(at));
}

function markdown(into, text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  let i = 0, para = [];
  const flush = () => { if (para.length) { const p = el('p'); inline(p, para.join('\n')); into.append(p); para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (/^\s*```/.test(l)) { // a code block, to its closing line (or the end)
      flush();
      const code = [];
      for (i++; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) code.push(lines[i]);
      i++;
      into.append(el('pre', {}, el('code', {}, code.join('\n'))));
    } else if (!l.trim()) { flush(); i++; }
    else if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { flush(); const h = el(m[1].length <= 2 ? 'h3' : 'h4'); inline(h, m[2]); into.append(h); i++; }
    else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flush(); into.append(el('hr')); i++; }
    else if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      flush();
      const t = el('table'), hr = el('tr');
      for (const c of cells(l)) { const th = el('th'); inline(th, c); hr.append(th); }
      t.append(el('thead', {}, hr));
      const body = el('tbody');
      for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) {
        const tr = el('tr');
        for (const c of cells(lines[i])) { const td = el('td'); inline(td, c); tr.append(td); }
        body.append(tr);
      }
      t.append(body);
      into.append(el('div', {class: 'tbl'}, t));
    } else if ((m = /^\s*([-*•]|\d+[.)])\s+/.exec(l))) { // a list: its lines, and the lines that go on under an item
      flush();
      const ordered = /\d/.test(m[1]), list = el(ordered ? 'ol' : 'ul');
      const item = ordered ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-*•]\s+(.*)$/;
      let li = null;
      for (; i < lines.length; i++) {
        const x = item.exec(lines[i]);
        if (x) { li = el('li'); inline(li, x[1]); list.append(li); }
        else if (li && /^\s{2,}\S/.test(lines[i])) { li.append('\n'); inline(li, lines[i].trim()); }
        else break;
      }
      into.append(list);
    } else if (/^\s*>/.test(l)) {
      flush();
      const q = [];
      for (; i < lines.length && (m = /^\s*>\s?(.*)$/.exec(lines[i])); i++) q.push(m[1]);
      const b = el('blockquote'); inline(b, q.join('\n')); into.append(b);
    } else { para.push(l); i++; }
  }
  flush();
}

// ------------------------------------------------------------ a reply's buttons: copy, quote, fork

/** The page is served over plain http on the tailnet, where browsers give no clipboard API: the old way does it. */
function copy(text, button) {
  const t = el('textarea', {style: 'position:fixed;opacity:0;top:0'});
  t.value = text;
  document.body.append(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  t.remove();
  if (!ok) { say('This browser didn’t allow copying. Select the text and copy it yourself.'); return; }
  const was = [...button.childNodes]; // (all of it: an icon, and a label beside it)
  button.replaceChildren(icon(I.check, 18), ...was.slice(1));
  setTimeout(() => button.replaceChildren(...was), 1200);
}

let quoted = null;

/** [what a message quotes, what it says itself] for one that begins with "> " lines, else null. */
function splitQuote(text) {
  if (!text.startsWith('>')) return null;
  const lines = text.split('\n'), q = [];
  let i = 0;
  for (; i < lines.length && lines[i].startsWith('>'); i++) q.push(lines[i].replace(/^> ?/, ''));
  return [q.join('\n').trim(), lines.slice(i).join('\n').trim()];
}

/** A reply quoted above the message box until it's sent or taken away (as much of it as the app quotes). */
function setQuote(text) {
  const own = text ? splitQuote(text) : null;
  let q = text ? (own ? own[1] : text).trim() : null;
  if (q && q.length > 800) q = q.slice(0, 800).trim() + '…';
  quoted = q || null;
  const box = $('quote');
  if (!box) return;
  box.textContent = '';
  if (!quoted) return;
  box.append(el('div', {class: 'quotebox'}, el('div', {class: 'quote'}, quoted),
    el('button', {'aria-label': 'Remove the quote', title: 'Remove the quote', onclick: () => setQuote(null)}, icon(I.x, 16))));
  $('msg').focus();
}

/** Your own message, changed: the chat goes on from there with the new words (the phone keeps the old chat, archived). */
/** The message being edited in place: its chat, where it is, and what is typed so far (kept over the chat's redraws). */
let editing = null;

/** The chat or one of its team's members works: no edit then (a member's answer would land in the cut chat). */
const teamBusy = () => !!chatData && (chatData.running || !!(chatData.team && (chatData.team.members || []).some(m => m.running)));

function edit(index, text) {
  if (teamBusy()) { say('The chat is working: edit the message when it’s done.'); return; }
  editing = {chat: open, at: index, text};
  drawn = '';
  drawChat();
}

/** Your message, editable where it is: its own bubble becomes the field, with Cancel and Ask again under it. */
function editor(r) {
  // the same field over the chat's redraws (a member's state changes often): the cursor and typing stay where they are
  if (editing.node) return editing.node;
  const ta = el('textarea', {class: 'tx', 'aria-label': 'Edit your message', rows: '1'});
  ta.value = editing.text;
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(360, ta.scrollHeight) + 'px'; };
  const cancel = () => { editing = null; drawn = ''; drawChat(); };
  const go = async () => {
    if (!editing || editing.sending) return;
    const t = ta.value.trim(), id = editing.chat, index = editing.at;
    if (!t) return;
    const was = editing;
    was.sending = true;
    ta.disabled = askBtn.disabled = true;
    try {
      const res = await api('/web/edit', {chat: id, index, text: t});
      if (res.error) { say(res.error); return; } // (kept as typed, to try again)
      say('');
      if (editing === was) editing = null;
      if (open === id) { toBottom = true; drawn = ''; chatData = await api('/web/chat?id=' + encodeURIComponent(id)); render(); }
    } catch (e) { say(e.message); }
    finally { was.sending = false; ta.disabled = askBtn.disabled = false; }
  };
  const askBtn = el('button', {class: 'btn primary', onclick: go}, 'Ask again');
  ta.addEventListener('input', () => { if (editing) editing.text = ta.value; fit(); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(); }
  });
  setTimeout(() => { fit(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
  editing.node = el('div', {class: 'mine editing'}, el('div', {class: 'user'}, ta),
    el('div', {class: 'edhint'}, 'Asked again from here: what came after it goes, and the chat as it was is kept in Archived.'),
    el('div', {class: 'line edbtns'}, el('button', {class: 'btn', onclick: cancel}, 'Cancel'), askBtn));
  return editing.node;
}

async function fork(index) {
  if (!open) return;
  try {
    const r = await api('/web/fork', {chat: open, index});
    if (r.error) say(r.error); else show(r.chat);
  } catch (e) { say(e.message); }
}

// ------------------------------------------------------------ a new chat's setup: agent, model, Linux tools, background

// what the next new chat starts with (null until the phone said what it offers): {agent, model, dev, background, o}
let draft = null;

async function newDraft(agent) {
  try {
    const o = await api('/web/new' + (agent ? '?agent=' + encodeURIComponent(agent) : ''));
    if (o.error || open) return;
    // another agent: its own models, so the model goes back to Default; the switches stay as they were set
    draft = {agent: o.agent, model: '', dev: draft && agent ? draft.dev : o.dev, background: draft && agent ? draft.background : o.background, o};
    render();
  } catch (e) {}
}

function setup() {
  const o = draft.o, agent = o.agents.find(a => a.id === draft.agent), model = o.models.find(m => m.id === draft.model);
  const pick = (label, value, onclick) => el('button', {onclick}, el('span', {}, el('small', {}, label), el('b', {}, value)), icon(I.chev, 16));
  const flip = (label, key, hint) => el('button', {class: draft[key] ? 'on' : '', 'aria-pressed': draft[key] ? 'true' : 'false', title: hint,
    onclick: () => { draft[key] = !draft[key]; render(); }}, el('span', {class: 'sw'}), el('span', {}, el('small', {}, label), el('b', {}, draft[key] ? 'On' : 'Off')));
  const row = el('div', {class: 'setup'});
  if (!o.agents.length) { row.append(el('p', {class: 'muted'}, 'No agent is signed in on the phone yet.')); return row; }
  row.append(pick('Agent', agent ? agent.name : draft.agent, () => sheet((box, close) => {
    box.append(el('h2', {}, 'Agent'));
    for (const a of o.agents) box.append(option(a.name + (a.def ? ' · default' : ''), a.id === draft.agent, () => { close(); if (a.id !== draft.agent) newDraft(a.id); }));
  })));
  row.append(pick('Model', model ? model.name || 'Default' : 'Default', () => sheet((box, close) => {
    box.append(el('h2', {}, 'Model'));
    for (const m of o.models) box.append(m.heading ? el('h3', {}, m.heading) : option(m.name || m.id || 'Default', m.id === draft.model, () => { close(); draft.model = m.id; render(); }));
    filterable(box);
  })));
  if (o.linux) row.append(flip('Linux tools', 'dev', 'The agent may run commands, install packages and edit files in Buddy’s Linux.'));
  if (o.canBackground) row.append(flip('Background mode', 'background', 'The agent works on a hidden screen, so the phone stays free.'));

// ------------------------------------------------------------ pickers: model and effort, agent, the chat's options

function sheet(build) {
  const d = el('dialog', {}), box = el('div', {class: 'sheet'});
  d.append(box);
  d.addEventListener('click', e => { if (e.target === d) d.close(); }); // (a click outside it)
  d.addEventListener('close', () => d.remove());
  build(box, () => d.close());
  document.body.append(d);
  d.showModal();
}

/** A search box over a long list of options: what doesn't match hides, and a heading with nothing left under it. */
function filterable(box) {
  const n = box.querySelectorAll('.opt').length;
  if (n < 12) return;
  const f = el('input', {class: 'filter', type: 'search', placeholder: 'Search ' + n + ' models', 'aria-label': 'Search models'});
  f.addEventListener('input', () => {
    const q = f.value.trim().toLowerCase();
    let head = null, any = false;
    const end = () => { if (head) head.hidden = !any; };
    for (const c of box.children) {
      if (c.tagName === 'H3') { end(); head = c; any = false; }
      else if (c.classList.contains('opt')) { const hit = !q || c.textContent.toLowerCase().includes(q); c.hidden = !hit; any = any || hit; }
    }
    end();
  });
  box.querySelector('h2').after(f);
  setTimeout(() => f.focus(), 0);
}

function option(name, on, pick) {
  return el('button', {class: 'opt' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', onclick: pick},
    el('span', {class: 'n'}, name), el('span', {class: 'c'}, icon(I.check, 18)));
}

/** One change on the phone, then the chat as it is now. */
async function change(body, chat) {
  const id = chat || open;
  try {
    const r = await api('/web/set', Object.assign({chat: id}, body));
    say(r.error || '');
    if (open === id) { chatData = await api('/web/chat?id=' + encodeURIComponent(id)); render(); }
  } catch (e) { say(e.message); }
}

async function options(chat) {
  try { const o = await api('/web/options?id=' + encodeURIComponent(chat || open)); if (o.error) { say(o.error); return null; } return o; }

}

async function pickModel() {

async function pickAgent() {

/**
 * A chat's menu, dropped down from its ⋯ in the list or from the header's button: pin, rename, archive, delete. On a
 * narrow window the header's chips are hidden, so the open chat's menu has the Linux tools and background switches too.
 */
function chatMenu(id, anchor) {
  const old = document.querySelector('.pop');
  if (old) { old.remove(); if (old.dataset.for === id + anchor.className) return; } // (the same button again: closed)
  const c = (state && state.chats.find(x => x.id === id)) || {}, title = c.title || (chatData && chatData.title) || 'Chat';
  const pop = el('div', {class: 'pop', role: 'menu'});
  pop.dataset.for = id + anchor.className;
  const shut = () => { pop.remove(); document.removeEventListener('pointerdown', away, true); document.removeEventListener('keydown', esc, true); };
  const away = e => { if (!pop.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) shut(); };
  const esc = e => { if (e.key === 'Escape') { shut(); anchor.focus(); } };
  const item = (name, run, danger) => el('button', {role: 'menuitem', class: danger ? 'danger' : '', onclick: () => { shut(); run(); }}, name);
  if (!c.archived) pop.append(item(c.pinned ? 'Unpin' : 'Pin', () => change({pinned: !c.pinned}, id)));
  // (marked unread, the open chat closes: open, it would be read again at once)
  pop.append(item(c.unread ? 'Mark as read' : 'Mark as unread', () => { change({unread: !c.unread}, id); if (!c.unread && id === open) show(null); }));
  pop.append(item('Rename', () => rename(id, title)));
  pop.append(item('Files', () => openView('files', id, title))); // (this chat's: its project folder, what was sent to it, its attachments)
  pop.append(item('Schedule…', () => editSchedule(id, title)));
  if (id === open && chatData && !chatData.error) pop.append(item('Team…', () => teamMenu()));
  pop.append(c.archived ? item('Bring back', () => change({archived: false}, id)) : item('Archive', () => change({archived: true}, id)));
  const d = id === open && chatData && !chatData.error ? chatData : null;
  if (d && anchor.id === 'optbtn' && window.matchMedia('(max-width: 820px)').matches) {
    if (d.linux) pop.append(item('Linux tools: turn ' + (d.dev ? 'off' : 'on'), () => change({dev: !d.dev}, id)));
    if (d.canBackground) pop.append(item('Background mode: turn ' + (d.background ? 'off' : 'on'), () => change({background: !d.background}, id)));
  }
  pop.append(item('Delete', () => remove(id, title), true));
  document.body.append(pop);
  // under the button, kept inside the window
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + 'px';
  pop.style.top = (r.bottom + h + 8 > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  document.addEventListener('pointerdown', away, true);
  document.addEventListener('keydown', esc, true);
  pop.firstChild.focus();
}

function rename(id, title) {
  sheet((box, close) => {
    const name = el('input', {value: title, maxlength: '120', 'aria-label': 'Chat name'});
    const save = () => { close(); if (name.value.trim() !== title) change({title: name.value}, id); };
    name.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    box.append(el('h2', {}, 'Rename'), el('div', {class: 'line'}, name, el('button', {class: 'btn primary', onclick: save}, 'Save')));
    setTimeout(() => { name.focus(); name.select(); }, 0);
  });
}

/** Deleting a chat, asked first: it can't be brought back (Archive can). */
function remove(id, title) {
  sheet((box, close) => {
    box.append(el('h2', {}, 'Delete “' + title + '”?'),
      el('p', {}, 'The chat and its attachments are deleted from the phone for good. To only put it away, use Archive.'),
      el('div', {class: 'line', style: 'justify-content:flex-end;margin-top:8px'}, el('button', {class: 'btn', onclick: close}, 'Cancel'),
